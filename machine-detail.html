<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Detail - Industrial Monitoring Web App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/motor-telemetry.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom Styles -->
    <style>
        /* Dark theme styles - Full Dark Version */
        .brand-dark {
            background-color: #020617;
            background-image:
                radial-gradient(at 20% 80%, #0f172a 0px, transparent 50%),
                radial-gradient(at 80% 20%, #0f172a 0px, transparent 50%),
                radial-gradient(at 40% 40%, #1e3a8a 0px, transparent 50%);
        }

        .text-on-dark {
            color: #f1f5f9;
        }

        .text-secondary-on-dark {
            color: #cbd5e1;
        }

        .card-on-dark {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            backdrop-filter: blur(10px);
        }

        .nav-link-dark {
            color: #cbd5e1;
            transition: color 0.3s ease;
        }

        .nav-link-dark:hover {
            color: #f1f5f9;
        }

        .nav-link-dark.active {
            color: #3b82f6;
        }

        /* Chart container */
        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }

        .detail-card {
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .detail-card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.6);
            box-shadow: 0 16px 40px -24px rgba(59, 130, 246, 0.9);
        }

        .health-ring {
            background: conic-gradient(#3b82f6 var(--score), #1e293b 0);
        }

        .live-dot {
            animation: livePulse 1.6s ease-in-out infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 0.45; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.15); }
        }
    </style>
</head>
<body class="brand-dark min-h-screen">
    <div id="root"></div>
    <script type="text/javascript">
        // Mock Data
        const mockMachines = [
            { id: 1, name: "Induction Motor", status: "warning", location: "Factory Floor 1", lastMaintenance: "NA", type: "motor" },
            { id: 2, name: "Hydraulic Press B", status: "normal", location: "Factory Floor 1", lastMaintenance: "2023-06-20", type: "press" },
            { id: 3, name: "Assembly Line C", status: "critical", location: "Factory Floor 2", lastMaintenance: "2023-04-10", type: "assembly" },
            { id: 4, name: "Packaging Machine D", status: "normal", location: "Factory Floor 2", lastMaintenance: "2023-06-18", type: "packaging" },
            { id: 5, name: "Welding Robot E", status: "warning", location: "Factory Floor 3", lastMaintenance: "2023-05-28", type: "robot" },
            { id: 6, name: "Conveyor Belt F", status: "normal", location: "Factory Floor 3", lastMaintenance: "2023-06-22", type: "conveyor" }
        ];

        // Get machine ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const machineId = urlParams.get('id');

        // Utility function to get machine by ID
        const getMachineById = (id) => {
            return mockMachines.find(machine => machine.id === parseInt(id));
        };
    </script>
    <script type="text/babel">
        // Navigation Bar Component
        const NavBar = () => {
            const navLinks = [
                { name: "Home", path: "index.html" },
                { name: "Dashboard", path: "dashboard.html" },
                { name: "Analytics", path: "Analytics.html" },
                { name: "Alerts", path: "Alerts.html" },
                { name: "AI Chat", path: "AI Chat.html" },
                { name: "Settings", path: "Settings.html" }
            ];
            const [authUser, setAuthUser] = React.useState(null);
            const [authReady, setAuthReady] = React.useState(false);

            React.useEffect(() => {
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                const storedEmail = localStorage.getItem('userEmail');
                const fallbackUser = storedEmail
                    ? { displayName: localStorage.getItem('profileName') || storedEmail.split('@')[0], email: storedEmail }
                    : null;

                if (!auth) {
                    setAuthUser(fallbackUser);
                    setAuthReady(true);
                    return;
                }

                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setAuthUser(user || fallbackUser);
                    setAuthReady(true);
                });

                return () => unsubscribe();
            }, []);

            const handleSignOut = async () => {
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                if (auth) {
                    try {
                        await auth.signOut();
                    } catch (error) {
                        console.error('Sign out failed:', error);
                    }
                }
                localStorage.removeItem('token');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userId');
                localStorage.removeItem('profileName');
                window.location.href = 'login.html';
            };

            // Get current page to highlight active link
            const getCurrentPage = () => {
                const path = window.location.pathname;
                const filename = path.substring(path.lastIndexOf('/') + 1);
                return filename === '' ? 'index.html' : filename;
            };

            const currentPage = getCurrentPage();

            return (
                <nav className="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md shadow-lg">
                    <div className="container mx-auto px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center space-x-10">
                            <div className="flex items-center">
                                <i data-lucide="activity" className="w-8 h-8 text-blue-500 mr-2"></i>
                                <span className="text-xl font-bold text-on-dark">Industrial Chatbot</span>
                            </div>

                            <div className="hidden md:flex space-x-8 relative">
                                {navLinks.map((link) => (
                                    <a
                                        key={link.name}
                                        href={link.path}
                                        className={`nav-link nav-link-dark px-1 py-2 ${currentPage === link.path ? 'active' : ''}`}
                                    >
                                        {link.name}
                                    </a>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center space-x-4">
                            {!authReady ? (
                                <div className="w-24 h-9 rounded-lg bg-slate-700/70 animate-pulse"></div>
                            ) : authUser ? (
                                <>
                                    <button
                                        onClick={() => window.location.href = "Settings.html?tab=profile"}
                                        className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-100 px-3 py-2 rounded-lg transition-colors border border-slate-600"
                                    >
                                        <span className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-semibold">
                                            {(authUser.displayName || authUser.email || "U").charAt(0).toUpperCase()}
                                        </span>
                                        <span className="hidden md:inline">{authUser.displayName || "Profile"}</span>
                                    </button>
                                    <button
                                        onClick={handleSignOut}
                                        className="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg transition-colors"
                                    >
                                        Sign Out
                                    </button>
                                </>
                            ) : null}
                        </div>
                    </div>
                </nav>
            );
        };

        // Machine Detail Component
        const MachineDetail = () => {
            const machine = getMachineById(machineId);
            const [temperatureData, setTemperatureData] = React.useState([]);
            const [vibrationData, setVibrationData] = React.useState([]);
            const [speedData, setSpeedData] = React.useState([]);
            const [voltageData, setVoltageData] = React.useState([]);
            const [powerData, setPowerData] = React.useState([]);
            const [calculatedPowerData, setCalculatedPowerData] = React.useState([]);
            const [powerFactorData, setPowerFactorData] = React.useState([]);
            const [currentData, setCurrentData] = React.useState([]);
            const [liveDataError, setLiveDataError] = React.useState('');
            const [lastGeneratedAt, setLastGeneratedAt] = React.useState('');
            const [timeLabels, setTimeLabels] = React.useState([]);

            React.useEffect(() => {
                if (!machine) return;
                // Initialize Lucide icons
                lucide.createIcons();

                // Initialize charts
                let tempChart, vibChart, speedChart, currentChart, voltageChart, waveformChart;

                const initCharts = () => {
                    // Generate initial data
                    const now = new Date();
                    const labels = [];
                    const tempValues = [];
                    const vibValues = [];
                    const speedValues = [];
                    const currentValues = [];

                    // Generate 60 data points (1 minute of data)
                    for (let i = 59; i >= 0; i--) {
                        const time = new Date(now - i * 1000);
                        labels.push(time.toLocaleString());

                        // Generate realistic values based on machine type
                        let baseTemp, baseVib, baseSpeed, baseCurrent;

                        switch(machine.type) {
                            case 'cnc':
                                baseTemp = 70; baseVib = 3.5; baseSpeed = 1200; baseCurrent = 18;
                                break;
                            case 'press':
                                baseTemp = 65; baseVib = 2.8; baseSpeed = 30; baseCurrent = 25;
                                break;
                            case 'assembly':
                                baseTemp = 75; baseVib = 4.2; baseSpeed = 60; baseCurrent = 15;
                                break;
                            case 'packaging':
                                baseTemp = 60; baseVib = 2.0; baseSpeed = 100; baseCurrent = 12;
                                break;
                            case 'robot':
                                baseTemp = 68; baseVib = 3.8; baseSpeed = 80; baseCurrent = 20;
                                break;
                            case 'conveyor':
                                baseTemp = 55; baseVib = 1.5; baseSpeed = 40; baseCurrent = 10;
                                break;
                            default:
                                baseTemp = 65; baseVib = 2.5; baseSpeed = 50; baseCurrent = 15;
                        }

                        // Add some random variation
                        tempValues.push(baseTemp + (Math.random() - 0.5) * 10);
                        vibValues.push(baseVib + (Math.random() - 0.5) * 2);
                        speedValues.push(baseSpeed + (Math.random() - 0.5) * 20);
                        currentValues.push(baseCurrent + (Math.random() - 0.5) * 5);
                    }

                    setTimeLabels(labels);
                    setTemperatureData(tempValues);
                    setVibrationData(vibValues);
                    setSpeedData(speedValues);
                    setCurrentData(currentValues);

                    // Temperature Chart
                    const tempCtx = document.getElementById('tempChart').getContext('2d');
                    tempChart = new Chart(tempCtx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Temperature (°F)',
                                data: tempValues,
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                borderWidth: 2,
                                tension: 0.4,
                                fill: true,
                                pointRadius: 0,
                                pointHoverRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: {
                                        color: '#cbd5e1'
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: {
                                        color: '#94a3b8',
                                        maxRotation: 0,
                                        autoSkip: true,
                                        maxTicksLimit: 10
                                    },
                                    grid: {
                                        color: 'rgba(148, 163, 184, 0.1)'
                                    }
                                },
                                y: {
                                    ticks: {
                                        color: '#94a3b8'
                                    },
                                    grid: {
                                        color: 'rgba(148, 163, 184, 0.1)'
                                    }
                                }
                            }
                        }
                    });

                    // Vibration Chart
                    const vibCtx = document.getElementById('vibChart').getContext('2d');
                    vibChart = new Chart(vibCtx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Vibration (mm/s)',
                                data: vibValues,
                                borderColor: '#eab308',
                                backgroundColor: 'rgba(234, 179, 8, 0.1)',
                                borderWidth: 2,
                                tension: 0.4,
                                fill: true,
                                pointRadius: 0,
                                pointHoverRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: {
                                        color: '#cbd5e1'
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: {
                                        color: '#94a3b8',
                                        maxRotation: 0,
                                        autoSkip: true,
                                        maxTicksLimit: 10
                                    },
                                    grid: {
                                        color: 'rgba(148, 163, 184, 0.1)'
                                    }
                                },
                                y: {
                                    ticks: {
                                        color: '#94a3b8'
                                    },
                                    grid: {
                                        color: 'rgba(148, 163, 184, 0.1)'
                                    }
                                }
                            }
                        }
                    });

                    // Speed Chart
                    const speedCtx = document.getElementById('powerChart').getContext('2d');
                    speedChart = new Chart(speedCtx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Watt (W)',
                                data: speedValues,
                                borderColor: '#22c55e',
                                backgroundColor: 'rgba(34, 197, 94, 0.1)',
                                borderWidth: 2,
                                tension: 0.4,
                                fill: true,
                                pointRadius: 0,
                                pointHoverRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: {
                                        color: '#cbd5e1'
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: {
                                        color: '#94a3b8',
                                        maxRotation: 0,
                                        autoSkip: true,
                                        maxTicksLimit: 10
                                    },
                                    grid: {
                                        color: 'rgba(148, 163, 184, 0.1)'
                                    }
                                },
                                y: {
                                    ticks: {
                                        color: '#94a3b8'
                                    },
                                    grid: {
                                        color: 'rgba(148, 163, 184, 0.1)'
                                    }
                                }
                            }
                        }
                    });

                    // Current Chart
                    const currentCtx = document.getElementById('currentChart').getContext('2d');
                    currentChart = new Chart(currentCtx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Current (A)',
                                data: currentValues,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                borderWidth: 2,
                                tension: 0.4,
                                fill: true,
                                pointRadius: 0,
                                pointHoverRadius: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    labels: {
                                        color: '#cbd5e1'
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: {
                                        color: '#94a3b8',
                                        maxRotation: 0,
                                        autoSkip: true,
                                        maxTicksLimit: 10
                                    },
                                    grid: {
                                        color: 'rgba(148, 163, 184, 0.1)'
                                    }
                                },
                                y: {
                                    min: 0,
                                    max: 5,
                                    ticks: {
                                        color: '#94a3b8'
                                    },
                                    grid: {
                                        color: 'rgba(148, 163, 184, 0.1)'
                                    }
                                }
                            }
                        }
                    });

                    // Voltage Chart
                    const voltageCtx = document.getElementById('voltageChart').getContext('2d');
                    voltageChart = new Chart(voltageCtx, {
                        type: 'line',
                        data: { labels: labels, datasets: [{ label: 'Voltage (V)', data: tempValues, borderColor: '#22c55e', backgroundColor: 'rgba(34, 197, 94, 0.1)', borderWidth: 2, tension: 0.4, fill: true, pointRadius: 0, pointHoverRadius: 0 }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { x: { ticks: { color: '#94a3b8', maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { color: 'rgba(148, 163, 184, 0.1)' } }, y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148, 163, 184, 0.1)' } } } }
                    });

                    // Electrical Waveform Chart
                    const waveformCtx = document.getElementById('waveformChart').getContext('2d');
                    waveformChart = new Chart(waveformCtx, {
                        type: 'line',
                        data: {
                            labels: [],
                            datasets: [
                                { label: 'Voltage waveform (V)', data: [], borderColor: '#22c55e', borderWidth: 2, tension: 0.35, pointRadius: 0, yAxisID: 'y' },
                                { label: 'Current waveform (A)', data: [], borderColor: '#3b82f6', borderWidth: 2, tension: 0.35, pointRadius: 0, yAxisID: 'y1' }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { labels: { color: '#cbd5e1' } } },
                            scales: {
                                x: { ticks: { color: '#94a3b8', maxTicksLimit: 8 }, grid: { color: 'rgba(148, 163, 184, 0.1)' } },
                                y: { position: 'left', ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148, 163, 184, 0.1)' } },
                                y1: { position: 'right', min: -5, max: 5, ticks: { color: '#94a3b8' }, grid: { drawOnChartArea: false } }
                            }
                        }
                    });

                    return { tempChart, vibChart, speedChart, currentChart, voltageChart, waveformChart };
                };

                const charts = initCharts();
                if (machine.type === 'motor') {
                    const fetchMotorSeries = async () => {
                        try {
                            const response = await fetch('https://api.thingspeak.com/channels/3340934/feeds.json?api_key=582TFZMMRBY94Z5S&results=60');
                            if (!response.ok) throw new Error('Live data fetch failed');
                            const payload = await response.json();
                            const feeds = Array.isArray(payload.feeds) ? payload.feeds : [];
                            if (!feeds.length) throw new Error('No live feed rows');
                            const motorFeeds = window.industrialMotorTelemetry
                                ? window.industrialMotorTelemetry.normalizeFeeds(feeds)
                                : feeds.map((f) => ({
                                    voltage: Number(f.field1) || 0,
                                    current: Math.min(Number(f.field2) || 0, 5),
                                    power: (Number(f.field1) || 0) * Math.min(Number(f.field2) || 0, 5),
                                    vibration: Number(f.field4) || 0,
                                    temperature: Number(f.field5) || 0,
                                    powerFactor: 0,
                                    apparentPower: (Number(f.field1) || 0) * Math.min(Number(f.field2) || 0, 5)
                                }));
                            const labels = feeds.map((f) => new Date(f.created_at).toLocaleString());
                            const volts = motorFeeds.map((f) => f.voltage);
                            const currents = motorFeeds.map((f) => f.current);
                            const powers = motorFeeds.map((f) => f.power);
                            const vibrations = motorFeeds.map((f) => f.vibration);
                            const temperatures = motorFeeds.map((f) => f.temperature);
                            const calculatedPowers = motorFeeds.map((f) => f.apparentPower);
                            const powerFactors = motorFeeds.map((f) => f.powerFactor);

                            setTimeLabels(labels);
                            setVoltageData(volts);
                            setCurrentData(currents);
                            setPowerData(powers);
                            setCalculatedPowerData(calculatedPowers);
                            setPowerFactorData(powerFactors);
                            setVibrationData(vibrations);
                            setTemperatureData(temperatures);
                            setLiveDataError('');
                            setLastGeneratedAt(feeds.length ? new Date(feeds[feeds.length - 1].created_at).toLocaleString() : '');

                            charts.tempChart.data.labels = labels;
                            charts.tempChart.data.datasets[0].data = temperatures;
                            charts.tempChart.update();
                            charts.vibChart.data.labels = labels;
                            charts.vibChart.data.datasets[0].data = vibrations;
                            charts.vibChart.update();
                            charts.currentChart.data.labels = labels;
                            charts.currentChart.data.datasets[0].data = currents;
                            charts.currentChart.update();
                            charts.voltageChart.data.labels = labels;
                            charts.voltageChart.data.datasets[0].data = volts;
                            charts.voltageChart.update();
                            charts.speedChart.data.labels = labels;
                            charts.speedChart.data.datasets[0].data = powers;
                            charts.speedChart.update();

                            const latestIndex = feeds.length - 1;
                            const latestVoltage = volts[latestIndex] || 0;
                            const latestCurrent = currents[latestIndex] || 0;
                            const latestPowerFactor = powerFactors[latestIndex] || 0;
                            const phaseShift = Math.acos(Math.max(-1, Math.min(1, latestPowerFactor)));
                            const waveformLabels = Array.from({ length: 121 }, (_, index) => `${index * 3}°`);
                            const voltageWaveform = waveformLabels.map((_, index) => latestVoltage * Math.sin((index * 3 * Math.PI) / 180));
                            const currentWaveform = waveformLabels.map((_, index) => latestCurrent * Math.sin((index * 3 * Math.PI) / 180 - phaseShift));
                            charts.waveformChart.data.labels = waveformLabels;
                            charts.waveformChart.data.datasets[0].data = voltageWaveform;
                            charts.waveformChart.data.datasets[1].data = currentWaveform;
                            charts.waveformChart.update();
                        } catch (error) {
                            console.error(error);
                            setLiveDataError('Unable to load live graph data.');
                            setVoltageData([]);
                            setCurrentData([]);
                            setPowerData([]);
                            setCalculatedPowerData([]);
                            setPowerFactorData([]);
                            setVibrationData([]);
                            setTemperatureData([]);
                        }
                    };
                    fetchMotorSeries();
                    const tsInterval = setInterval(fetchMotorSeries, 15000);
                    return () => {
                        clearInterval(tsInterval);
                        if (charts.tempChart) charts.tempChart.destroy();
                        if (charts.vibChart) charts.vibChart.destroy();
                        if (charts.speedChart) charts.speedChart.destroy();
                        if (charts.currentChart) charts.currentChart.destroy();
                        if (charts.voltageChart) charts.voltageChart.destroy();
                        if (charts.waveformChart) charts.waveformChart.destroy();
                    };
                }

                // Update charts every second
                const interval = setInterval(() => {
                    const now = new Date();
                    const newTime = now.toLocaleString();

                    // Generate new values based on machine type
                    let baseTemp, baseVib, baseSpeed, baseCurrent;

                    switch(machine.type) {
                        case 'cnc':
                            baseTemp = 70; baseVib = 3.5; baseSpeed = 1200; baseCurrent = 18;
                            break;
                        case 'press':
                            baseTemp = 65; baseVib = 2.8; baseSpeed = 30; baseCurrent = 25;
                            break;
                        case 'assembly':
                            baseTemp = 75; baseVib = 4.2; baseSpeed = 60; baseCurrent = 15;
                            break;
                        case 'packaging':
                            baseTemp = 60; baseVib = 2.0; baseSpeed = 100; baseCurrent = 12;
                            break;
                        case 'robot':
                            baseTemp = 68; baseVib = 3.8; baseSpeed = 80; baseCurrent = 20;
                            break;
                        case 'conveyor':
                            baseTemp = 55; baseVib = 1.5; baseSpeed = 40; baseCurrent = 10;
                            break;
                        default:
                            baseTemp = 65; baseVib = 2.5; baseSpeed = 50; baseCurrent = 15;
                    }

                    // Add some random variation
                    const newTemp = baseTemp + (Math.random() - 0.5) * 10;
                    const newVib = baseVib + (Math.random() - 0.5) * 2;
                    const newSpeed = baseSpeed + (Math.random() - 0.5) * 20;
                    const newCurrent = baseCurrent + (Math.random() - 0.5) * 5;

                    // Update data arrays
                    const newLabels = [...timeLabels.slice(1), newTime];
                    const newTempData = [...temperatureData.slice(1), newTemp];
                    const newVibData = [...vibrationData.slice(1), newVib];
                    const newSpeedData = [...speedData.slice(1), newSpeed];
                    const newCurrentData = [...currentData.slice(1), newCurrent];

                    setTimeLabels(newLabels);
                    setTemperatureData(newTempData);
                    setVibrationData(newVibData);
                    setSpeedData(newSpeedData);
                    setCurrentData(newCurrentData);

                    // Update charts
                    charts.tempChart.data.labels = newLabels;
                    charts.tempChart.data.datasets[0].data = newTempData;
                    charts.tempChart.update('none');

                    charts.vibChart.data.labels = newLabels;
                    charts.vibChart.data.datasets[0].data = newVibData;
                    charts.vibChart.update('none');

                    charts.speedChart.data.labels = newLabels;
                    charts.speedChart.data.datasets[0].data = newSpeedData;
                    charts.speedChart.update('none');

                    charts.currentChart.data.labels = newLabels;
                    charts.currentChart.data.datasets[0].data = newCurrentData;
                    charts.currentChart.update('none');
                }, 1000);

                // Cleanup on unmount
                return () => {
                    clearInterval(interval);
                    if (charts.tempChart) charts.tempChart.destroy();
                    if (charts.vibChart) charts.vibChart.destroy();
                    if (charts.speedChart) charts.speedChart.destroy();
                    if (charts.currentChart) charts.currentChart.destroy();
                    if (charts.voltageChart) charts.voltageChart.destroy();
                    if (charts.waveformChart) charts.waveformChart.destroy();
                };
            }, [machineId]);

            if (!machine) {
                return (
                    <div className="p-8">
                        <NavBar />
                        <div className="mt-16">
                            <h1 className="text-2xl font-bold text-on-dark mb-4">Machine Not Found</h1>
                            <p className="text-secondary-on-dark">The requested machine does not exist.</p>
                            <button
                                className="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors"
                                onClick={() => window.location.href = "dashboard.html"}
                            >
                                Back to Dashboard
                            </button>
                        </div>
                    </div>
                );
            }

            const getStatusColor = (status) => {
                switch (status) {
                    case 'critical': return 'text-red-600 bg-red-100';
                    case 'warning': return 'text-yellow-600 bg-yellow-100';
                    default: return 'text-green-600 bg-green-100';
                }
            };

            const getStatusText = (status) => {
                switch (status) {
                    case 'critical': return 'Critical';
                    case 'warning': return 'Warning';
                    default: return 'Normal';
                }
            };

            const getLatestValue = (series, fallback = 0) => {
                const latest = series.length ? Number(series[series.length - 1]) : fallback;
                return Number.isFinite(latest) ? latest : fallback;
            };

            const latestVoltage = getLatestValue(voltageData);
            const latestCurrent = getLatestValue(currentData);
            const latestPower = getLatestValue(powerData);
            const latestVibration = getLatestValue(vibrationData);
            const latestTemperature = getLatestValue(temperatureData);
            const latestPowerFactor = getLatestValue(powerFactorData);
            const latestCalculatedPower = getLatestValue(calculatedPowerData);

            const getHealthSummary = () => {
                let score = 96;
                const reasons = [];

                if (latestTemperature >= 80) { score -= 28; reasons.push('temperature is critical'); }
                else if (latestTemperature >= 70) { score -= 12; reasons.push('temperature is warming up'); }

                if (latestVibration >= 5) { score -= 30; reasons.push('vibration is high'); }
                else if (latestVibration >= 3) { score -= 14; reasons.push('vibration is elevated'); }

                if (latestCurrent >= 4.5 || latestPower >= 1000) { score -= 12; reasons.push('electrical load is high'); }
                if (latestVoltage && (latestVoltage < 180 || latestVoltage > 260)) { score -= 10; reasons.push('voltage is outside safe band'); }

                const safeScore = Math.max(20, Math.min(100, score));
                const status = safeScore < 55 ? 'Critical' : safeScore < 78 ? 'Warning' : 'Healthy';
                const color = safeScore < 55 ? 'text-red-300' : safeScore < 78 ? 'text-yellow-300' : 'text-green-300';
                const maintenance = safeScore < 55
                    ? 'Maintenance required immediately before restart.'
                    : safeScore < 78
                        ? 'Plan preventive maintenance within 48 hours.'
                        : 'Routine maintenance is enough for now.';

                return {
                    score: safeScore,
                    status,
                    color,
                    reasons: reasons.length ? reasons : ['all major readings look stable'],
                    maintenance
                };
            };

            const healthSummary = getHealthSummary();
            const nextMaintenance = healthSummary.status === 'Critical'
                ? 'Immediate inspection'
                : healthSummary.status === 'Warning'
                    ? 'Within 48 hours'
                    : 'Routine window';
            const operatingHours = machine.type === 'motor' ? 'Live monitored' : 'Simulated trend';
            const efficiencyRating = latestPowerFactor ? `${Math.round(latestPowerFactor * 100)}% PF` : 'Calculating';

            const metricCards = [
                { label: 'Voltage', value: latestVoltage ? latestVoltage.toFixed(1) : '—', unit: 'V', icon: 'zap', hint: 'Input supply level' },
                { label: 'Current', value: latestCurrent ? latestCurrent.toFixed(1) : '—', unit: 'A', icon: 'activity', hint: 'Motor electrical draw' },
                { label: 'Power', value: latestPower ? latestPower.toFixed(1) : '—', unit: 'W', icon: 'gauge', hint: 'Real measured power' },
                { label: 'Temperature', value: latestTemperature ? latestTemperature.toFixed(1) : '—', unit: '°F', icon: 'thermometer', hint: latestTemperature >= 70 ? 'Watch cooling and load' : 'Thermal level stable' }
            ];

            const openAiWithPrompt = (prompt) => {
                localStorage.setItem('industrialAiSuggestedPrompt', prompt);
                window.location.href = `AI Chat.html?prompt=${encodeURIComponent(prompt)}`;
            };

            const scrollToMaintenance = () => {
                document.getElementById('maintenance-panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            const handleExportCsv = () => {
                if (!timeLabels.length) return;
                let csv = 'Date Time,Voltage (V),Current (A),Measured Power (W),Calculated Power (VA),Power Factor,Vibration (mm/s),Temperature (°F)\n';
                for (let i = 0; i < timeLabels.length; i++) {
                    csv += `${timeLabels[i]},${voltageData[i] ?? ''},${currentData[i] ?? ''},${powerData[i] ?? ''},${calculatedPowerData[i] ?? ''},${powerFactorData[i] ?? ''},${vibrationData[i] ?? ''},${temperatureData[i] ?? ''}\n`;
                }
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${machine.name.replace(/\s+/g, '_')}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            return (
                <div>
                    <NavBar />
                    <div className="p-8">
                        <div className="mb-8 card-on-dark rounded-2xl p-6 shadow-xl">
                            <button
                                className="flex items-center text-blue-400 hover:text-blue-300 mb-5"
                                onClick={() => window.location.href = "dashboard.html"}
                            >
                                <i data-lucide="arrow-left" className="w-4 h-4 mr-1"></i>
                                Back to Dashboard
                            </button>
                            <div className="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
                                <div>
                                    <div className="flex flex-wrap items-center gap-3 mb-3">
                                        <h1 className="text-3xl font-bold text-on-dark">{machine.name}</h1>
                                        <span className={`px-3 py-1 rounded-full text-sm font-medium ${getStatusColor(machine.status)}`}>
                                            {getStatusText(machine.status)}
                                        </span>
                                        <span className="inline-flex items-center gap-2 rounded-full bg-slate-800 px-3 py-1 text-sm text-green-300">
                                            <span className="live-dot h-2 w-2 rounded-full bg-green-400"></span>
                                            {machine.type === 'motor' ? 'Live feed connected' : 'Simulated monitoring'}
                                        </span>
                                    </div>
                                    <p className="text-secondary-on-dark">{machine.location}</p>
                                    <p className="mt-3 max-w-2xl text-sm text-slate-400">
                                        Quick view of health, live telemetry, waveform behavior, and maintenance priority for this machine.
                                    </p>
                                </div>
                                <div className="flex flex-wrap gap-3">
                                    <button
                                        onClick={() => openAiWithPrompt(`Check ${machine.name} status and explain maintenance timing`)}
                                        className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center"
                                    >
                                        <i data-lucide="bot" className="w-4 h-4 mr-2"></i>
                                        Ask AI
                                    </button>
                                    <button
                                        onClick={scrollToMaintenance}
                                        className="bg-slate-800 hover:bg-slate-700 text-slate-100 px-4 py-2 rounded-lg transition-colors flex items-center border border-slate-600"
                                    >
                                        <i data-lucide="calendar-check" className="w-4 h-4 mr-2"></i>
                                        Maintenance
                                    </button>
                                    <button
                                        onClick={handleExportCsv}
                                        className="bg-slate-800 hover:bg-slate-700 text-slate-100 px-4 py-2 rounded-lg transition-colors flex items-center border border-slate-600"
                                    >
                                        <i data-lucide="download" className="w-4 h-4 mr-2"></i>
                                        Export CSV
                                    </button>
                                </div>
                            </div>
                        </div>
                        {liveDataError && machine.type === 'motor' && (
                            <div className="mb-4 text-red-400">{liveDataError}</div>
                        )}
                        {machine.type === 'motor' && lastGeneratedAt && (
                            <div className="mb-4 text-sm text-secondary-on-dark">Latest data timestamp: {lastGeneratedAt}</div>
                        )}
                        <div className="grid grid-cols-1 gap-6 mb-8 xl:grid-cols-3">
                            <div className="detail-card card-on-dark rounded-xl p-6 xl:col-span-1">
                                <div className="flex items-center justify-between gap-4">
                                    <div>
                                        <p className="text-sm text-secondary-on-dark">Overall Health</p>
                                        <h2 className={`mt-2 text-3xl font-bold ${healthSummary.color}`}>{healthSummary.status}</h2>
                                        <p className="mt-3 text-sm text-slate-400">Reason: {healthSummary.reasons.join(', ')}.</p>
                                    </div>
                                    <div className="health-ring flex h-24 w-24 items-center justify-center rounded-full" style={{ '--score': `${healthSummary.score}%` }}>
                                        <div className="flex h-20 w-20 items-center justify-center rounded-full bg-slate-950 text-xl font-bold text-on-dark">
                                            {healthSummary.score}%
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="detail-card card-on-dark rounded-xl p-6 xl:col-span-2">
                                <div className="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                                    <div>
                                        <p className="text-sm text-secondary-on-dark">Recommended Next Step</p>
                                        <h3 className="mt-2 text-xl font-semibold text-on-dark">{healthSummary.maintenance}</h3>
                                        <p className="mt-2 text-sm text-slate-400">Next maintenance: {nextMaintenance}. Use Ask AI for a detailed reason and checklist.</p>
                                    </div>
                                    <button
                                        onClick={() => openAiWithPrompt(`When is next maintenance required for ${machine.name}? Explain the reason from live readings.`)}
                                        className="self-start rounded-lg bg-blue-600 px-4 py-2 text-white transition-colors hover:bg-blue-700 lg:self-center"
                                    >
                                        Ask maintenance timing
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 gap-4 mb-8 md:grid-cols-2 xl:grid-cols-4">
                            {metricCards.map((card) => (
                                <div key={card.label} className="detail-card card-on-dark rounded-xl p-5">
                                    <div className="mb-4 flex items-center justify-between">
                                        <span className="text-sm text-secondary-on-dark">{card.label}</span>
                                        <i data-lucide={card.icon} className="h-5 w-5 text-blue-400"></i>
                                    </div>
                                    <div className="text-2xl font-bold text-on-dark">{card.value} <span className="text-sm text-slate-400">{card.unit}</span></div>
                                    <p className="mt-2 text-xs text-slate-400">{card.hint}</p>
                                </div>
                            ))}
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                            <div className="detail-card card-on-dark rounded-xl shadow-md p-6">
                                <h3 className="text-lg font-semibold text-on-dark mb-4">Voltage</h3>
                                <div className="chart-container">
                                    <canvas id="voltageChart"></canvas>
                                </div>
                                <div className="mt-4 text-center">
                                    <span className="text-2xl font-bold text-on-dark">
                                        {voltageData.length > 0 ? Number(voltageData[voltageData.length - 1]).toFixed(1) : 'Loading...'} V
                                    </span>
                                </div>
                            </div>
                            <div className="detail-card card-on-dark rounded-xl shadow-md p-6">
                                <h3 className="text-lg font-semibold text-on-dark mb-4">Temperature</h3>
                                <div className="chart-container">
                                    <canvas id="tempChart"></canvas>
                                </div>
                                <div className="mt-4 text-center">
                                    <span className="text-2xl font-bold text-on-dark">
                                        {temperatureData.length > 0 ? temperatureData[temperatureData.length - 1].toFixed(1) : 'Loading...'} °F
                                    </span>
                                </div>
                            </div>
                            <div className="detail-card card-on-dark rounded-xl shadow-md p-6">
                                <h3 className="text-lg font-semibold text-on-dark mb-4">Vibration</h3>
                                <div className="chart-container">
                                    <canvas id="vibChart"></canvas>
                                </div>
                                <div className="mt-4 text-center">
                                    <span className="text-2xl font-bold text-on-dark">
                                        {vibrationData.length > 0 ? vibrationData[vibrationData.length - 1].toFixed(1) : 'Loading...'} mm/s
                                    </span>
                                </div>
                            </div>
                            <div className="detail-card card-on-dark rounded-xl shadow-md p-6">
                                <h3 className="text-lg font-semibold text-on-dark mb-4">Power</h3>
                                <div className="chart-container">
                                    <canvas id="powerChart"></canvas>
                                </div>
                                <div className="mt-4 text-center">
                                    <span className="text-2xl font-bold text-on-dark">
                                        {powerData.length > 0 ? Number(powerData[powerData.length - 1]).toFixed(1) : 'Loading...'} W
                                    </span>
                                </div>
                            </div>
                            <div className="detail-card card-on-dark rounded-xl shadow-md p-6">
                                <h3 className="text-lg font-semibold text-on-dark mb-4">Current</h3>
                                <div className="chart-container">
                                    <canvas id="currentChart"></canvas>
                                </div>
                                <div className="mt-4 text-center">
                                    <span className="text-2xl font-bold text-on-dark">
                                        {currentData.length > 0 ? currentData[currentData.length - 1].toFixed(1) : 'Loading...'} A
                                    </span>
                                </div>
                            </div>
                            <div className="detail-card card-on-dark rounded-xl shadow-md p-6">
                                <h3 className="text-lg font-semibold text-on-dark mb-4">Calculated Power (V × I)</h3>
                                <div className="mt-4 text-center">
                                    <span className="text-2xl font-bold text-on-dark">
                                        {calculatedPowerData.length > 0 ? Number(calculatedPowerData[calculatedPowerData.length - 1]).toFixed(1) : 'Loading...'} VA
                                    </span>
                                </div>
                                <p className="text-secondary-on-dark text-sm mt-3 text-center">Apparent power uses live voltage × derived current.</p>
                            </div>
                            <div className="detail-card card-on-dark rounded-xl shadow-md p-6">
                                <h3 className="text-lg font-semibold text-on-dark mb-4">Power Factor</h3>
                                <div className="mt-4 text-center">
                                    <span className="text-2xl font-bold text-on-dark">
                                        {powerFactorData.length > 0 ? Number(powerFactorData[powerFactorData.length - 1]).toFixed(3) : 'Loading...'}
                                    </span>
                                </div>
                                <p className="text-secondary-on-dark text-sm mt-3 text-center">PF is calculated from the induction motor load estimate.</p>
                            </div>
                        </div>
                        <div className="detail-card card-on-dark rounded-xl shadow-md p-6 mb-8">
                            <h3 className="text-lg font-semibold text-on-dark mb-4">Electrical Waveform</h3>
                            <div className="chart-container">
                                <canvas id="waveformChart"></canvas>
                            </div>
                            <p className="text-secondary-on-dark text-sm mt-4">Waveform uses live voltage, derived current, and calculated phase shift from power factor.</p>
                        </div>
                        <div id="maintenance-panel" className="detail-card card-on-dark rounded-xl shadow-md p-6">
                            <div className="mb-6 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
                                <div>
                                    <h3 className="text-lg font-semibold text-on-dark">Maintenance Information</h3>
                                    <p className="mt-1 text-sm text-secondary-on-dark">Actionable maintenance status calculated from the latest machine readings.</p>
                                </div>
                                <button
                                    onClick={() => openAiWithPrompt(`Create a maintenance checklist for ${machine.name} based on current voltage, current, power, vibration and temperature.`)}
                                    className="rounded-lg bg-blue-600 px-4 py-2 text-white transition-colors hover:bg-blue-700"
                                >
                                    Generate checklist with AI
                                </button>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="rounded-lg bg-slate-900/70 p-4">
                                    <p className="text-secondary-on-dark">Last Maintenance</p>
                                    <p className="font-medium text-on-dark">{machine.lastMaintenance}</p>
                                </div>
                                <div className="rounded-lg bg-slate-900/70 p-4">
                                    <p className="text-secondary-on-dark">Next Scheduled Maintenance</p>
                                    <p className="font-medium text-on-dark">{nextMaintenance}</p>
                                </div>
                                <div className="rounded-lg bg-slate-900/70 p-4">
                                    <p className="text-secondary-on-dark">Operating Status</p>
                                    <p className="font-medium text-on-dark">{operatingHours}</p>
                                </div>
                                <div className="rounded-lg bg-slate-900/70 p-4">
                                    <p className="text-secondary-on-dark">Efficiency Rating</p>
                                    <p className="font-medium text-on-dark">{efficiencyRating}</p>
                                </div>
                            </div>
                            <div className="mt-5 rounded-lg border border-blue-900/60 bg-blue-950/30 p-4 text-sm text-blue-100">
                                Recommended action: {healthSummary.maintenance} Main reason: {healthSummary.reasons.join(', ')}.
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            return <MachineDetail />;
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
