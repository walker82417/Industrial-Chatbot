<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Industrial Monitoring Web App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/motor-telemetry.js"></script>

    <!-- Custom Styles -->
    <style>
        /* Dark theme styles - Full Dark Version */
        .brand-dark {
            background-color: #020617;
            background-image:
                radial-gradient(at 20% 80%, #0f172a 0px, transparent 50%),
                radial-gradient(at 80% 20%, #0f172a 0px, transparent 50%),
                radial-gradient(at 40% 40%, #1e3a8a 0px, transparent 50%);
        }

        .text-on-dark {
            color: #f1f5f9;
        }

        .text-secondary-on-dark {
            color: #cbd5e1;
        }

        .card-on-dark {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            backdrop-filter: blur(10px);
        }

        .nav-link-dark {
            color: #cbd5e1;
            transition: color 0.3s ease;
        }

        .nav-link-dark:hover {
            color: #f1f5f9;
        }

        .nav-link-dark.active {
            color: #3b82f6;
        }
    </style>
</head>
<body class="brand-dark min-h-screen">
    <div id="root"></div>
    <script type="text/javascript">
        // Mock Data
        const dashboardMachines = [
            { id: 1, name: "Induction Motor", status: "warning", location: "Factory Floor 1" },
            { id: 2, name: "Gear Hobbing Machine", status: "normal", location: "Factory Floor 1" }
        ];
        const mockAlerts = dashboardMachines.map((machine) => ({
            id: machine.id,
            machineId: machine.id,
            machineName: machine.name,
            type: machine.status === 'warning' ? 'warning' : 'info',
            message: machine.status === 'warning' ? 'Needs Attention: inspect machine parameters' : 'Machine operating normally',
            timestamp: new Date().toLocaleString(),
            resolved: machine.status === 'normal'
        }));
    </script>
    <script type="text/babel">
        // Navigation Bar Component
        const NavBar = () => {
            const navLinks = [
                { name: "Home", path: "index.html" },
                { name: "Dashboard", path: "dashboard.html" },
                { name: "Analytics", path: "Analytics.html" },
                { name: "Alerts", path: "Alerts.html" },
                { name: "AI Chat", path: "AI Chat.html" },
                { name: "Settings", path: "Settings.html" }
            ];
            const [authUser, setAuthUser] = React.useState(null);
            const [authReady, setAuthReady] = React.useState(false);

            React.useEffect(() => {
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                const storedEmail = localStorage.getItem('userEmail');
                const fallbackUser = storedEmail
                    ? { displayName: localStorage.getItem('profileName') || storedEmail.split('@')[0], email: storedEmail }
                    : null;

                if (!auth) {
                    setAuthUser(fallbackUser);
                    setAuthReady(true);
                    return;
                }

                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setAuthUser(user || fallbackUser);
                    setAuthReady(true);
                });

                return () => unsubscribe();
            }, []);

            const handleSignOut = async () => {
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                if (auth) {
                    try {
                        await auth.signOut();
                    } catch (error) {
                        console.error('Sign out failed:', error);
                    }
                }
                localStorage.removeItem('token');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userId');
                localStorage.removeItem('profileName');
                window.location.href = 'login.html';
            };

            const getCurrentPage = () => {
                const path = window.location.pathname;
                const filename = path.substring(path.lastIndexOf('/') + 1);
                return filename === '' ? 'index.html' : filename;
            };

            const currentPage = getCurrentPage();

            return (
                <nav className="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md shadow-lg">
                    <div className="container mx-auto px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center space-x-10">
                            <div className="flex items-center">
                                <i data-lucide="activity" className="w-8 h-8 text-blue-500 mr-2"></i>
                                <span className="text-xl font-bold text-on-dark">Industrial Chatbot</span>
                            </div>
                            <div className="hidden md:flex space-x-8 relative">
                                {navLinks.map((link) => (
                                    <a key={link.name} href={link.path} className={`nav-link nav-link-dark px-1 py-2 ${currentPage === link.path ? 'active' : ''}`}>
                                        {link.name}
                                    </a>
                                ))}
                            </div>
                        </div>
                        <div className="flex items-center space-x-4">
                            {!authReady ? (
                                <div className="w-24 h-9 rounded-lg bg-slate-700/70 animate-pulse"></div>
                            ) : authUser ? (
                                <>
                                    <button
                                        onClick={() => window.location.href = "Settings.html?tab=profile"}
                                        className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-100 px-3 py-2 rounded-lg transition-colors border border-slate-600"
                                    >
                                        <span className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-semibold">
                                            {(authUser.displayName || authUser.email || "U").charAt(0).toUpperCase()}
                                        </span>
                                        <span className="hidden md:inline">{authUser.displayName || "Profile"}</span>
                                    </button>
                                    <button
                                        onClick={handleSignOut}
                                        className="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg transition-colors"
                                    >
                                        Sign Out
                                    </button>
                                </>
                            ) : null}
                        </div>
                    </div>
                </nav>
            );
        };

        // Alerts Component
        const Alerts = () => {
            const [alerts, setAlerts] = React.useState(mockAlerts);
            const [liveMotorData, setLiveMotorData] = React.useState(null);
            const [liveAlertError, setLiveAlertError] = React.useState('');
            const [filters, setFilters] = React.useState({
                machine: '',
                type: '',
                status: 'active'
            });

            const filteredAlerts = React.useMemo(() => {
                return alerts.filter(alert => {
                    return (
                        (filters.machine === '' || alert.machineName.toLowerCase().includes(filters.machine.toLowerCase())) &&
                        (filters.type === '' || alert.type === filters.type) &&
                        (filters.status === 'all' ||
                         (filters.status === 'active' && !alert.resolved) ||
                         (filters.status === 'resolved' && alert.resolved))
                    );
                });
            }, [filters, alerts]);

            const criticalAlerts = filteredAlerts.filter(alert => alert.type === 'critical' && !alert.resolved);
            const warningAlerts = filteredAlerts.filter(alert => alert.type === 'warning' && !alert.resolved);
            const infoAlerts = filteredAlerts.filter(alert => alert.type === 'info' && !alert.resolved);
            const resolvedAlerts = filteredAlerts.filter(alert => alert.resolved);

            React.useEffect(() => {
                lucide.createIcons();
            }, [filteredAlerts]);

            React.useEffect(() => {
                const fetchLiveMotorAlert = async () => {
                    try {
                        const response = await fetch('https://api.thingspeak.com/channels/3340934/feeds/last.json?api_key=582TFZMMRBY94Z5S');
                        if (!response.ok) throw new Error('Unable to fetch induction motor feed');
                        const feed = await response.json();
                        const motorData = window.industrialMotorTelemetry
                            ? window.industrialMotorTelemetry.normalizeFeed(feed)
                            : {
                                voltage: Number(feed.field1) || 0,
                                current: Math.min(Number(feed.field2) || 0, 5),
                                power: (Number(feed.field1) || 0) * Math.min(Number(feed.field2) || 0, 5),
                                vibration: Number(feed.field4) || 0,
                                temperature: Number(feed.field5) || 0,
                                powerFactor: 0,
                                capturedAt: feed.created_at
                            };
                        const assessment = window.industrialMotorTelemetry
                            ? window.industrialMotorTelemetry.assessInductionMotor(motorData)
                            : { severity: 'info', alerts: [], summary: 'Induction motor live data loaded.' };
                        const liveAlert = {
                            id: 'live-induction-motor',
                            machineId: 1,
                            machineName: 'Induction Motor',
                            type: assessment.severity,
                            message: assessment.summary,
                            timestamp: motorData.capturedAt ? new Date(motorData.capturedAt).toLocaleString() : new Date().toLocaleString(),
                            resolved: assessment.severity === 'info',
                            details: assessment.alerts
                        };

                        setLiveMotorData(motorData);
                        setAlerts(prev => [liveAlert, ...prev.filter(alert => alert.id !== 'live-induction-motor' && alert.machineId !== 1)]);
                        setLiveAlertError('');
                    } catch (error) {
                        console.error(error);
                        setLiveAlertError('Unable to refresh live induction motor alerts right now.');
                    }
                };

                fetchLiveMotorAlert();
                const refreshInterval = setInterval(fetchLiveMotorAlert, 15000);
                return () => clearInterval(refreshInterval);
            }, []);

            const handleFilterChange = (key, value) => {
                setFilters(prev => ({ ...prev, [key]: value }));
            };

            const getAlertBorderClass = (type) => {
                switch (type) {
                    case 'critical': return 'border-red-500';
                    case 'warning': return 'border-yellow-500';
                    case 'info': return 'border-blue-500';
                    default: return 'border-slate-600';
                }
            };

            const getAlertIcon = (type) => {
                switch (type) {
                    case 'critical': return 'alert-circle';
                    case 'warning': return 'alert-triangle';
                    case 'info': return 'info';
                    default: return 'bell';
                }
            };

            const getAlertIconColor = (type) => {
                switch (type) {
                    case 'critical': return 'text-red-500';
                    case 'warning': return 'text-yellow-500';
                    case 'info': return 'text-blue-500';
                    default: return 'text-slate-500';
                }
            };

            return (
                <div>
                    <NavBar />
                    <div className="container mx-auto p-8">
                        <div className="mb-8">
                            <h1 className="text-2xl font-bold text-on-dark mb-2">Alert Management</h1>
                            <p className="text-secondary-on-dark">Live induction motor alerts use real voltage/temperature plus derived current, vibration, power, and PF.</p>
                            {liveAlertError && <p className="text-sm text-red-400 mt-2">{liveAlertError}</p>}
                            {liveMotorData && (
                                <p className="text-xs text-blue-300 mt-2">
                                    Live motor: {liveMotorData.voltage} V, {liveMotorData.temperature} °F, derived {liveMotorData.current} A, {liveMotorData.vibration} mm/s, PF {liveMotorData.powerFactor}, {liveMotorData.power} W
                                </p>
                            )}
                        </div>

                        {/* Filter Section */}
                        <div className="card-on-dark rounded-xl shadow-md p-6 mb-8">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div>
                                    <label className="block text-secondary-on-dark mb-2">Machine</label>
                                    <input
                                        type="text"
                                        placeholder="Filter by machine..."
                                        className="w-full border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-900 text-on-dark"
                                        value={filters.machine}
                                        onChange={(e) => handleFilterChange('machine', e.target.value)}
                                    />
                                </div>

                                <div>
                                    <label className="block text-secondary-on-dark mb-2">Alert Type</label>
                                    <select
                                        className="w-full border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-900 text-on-dark"
                                        value={filters.type}
                                        onChange={(e) => handleFilterChange('type', e.target.value)}
                                    >
                                        <option value="">All Types</option>
                                        <option value="critical">Critical</option>
                                        <option value="warning">Warning</option>
                                        <option value="info">Info</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-secondary-on-dark mb-2">Status</label>
                                    <select
                                        className="w-full border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-900 text-on-dark"
                                        value={filters.status}
                                        onChange={(e) => handleFilterChange('status', e.target.value)}
                                    >
                                        <option value="active">Active</option>
                                        <option value="resolved">Resolved</option>
                                        <option value="all">All</option>
                                    </select>
                                </div>

                                <div className="flex items-end">
                                    <button
                                        className="w-full bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg transition-colors"
                                        onClick={() => setFilters({ machine: '', type: '', status: 'active' })}
                                    >
                                        Clear Filters
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Summary Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                            <div className="card-on-dark rounded-xl shadow-md p-6">
                                <div className="flex items-center">
                                    <div className="w-12 h-12 bg-blue-900 rounded-lg flex items-center justify-center mr-4">
                                        <i data-lucide="bell" className="w-6 h-6 text-blue-400"></i>
                                    </div>
                                    <div>
                                        <p className="text-secondary-on-dark">Total Alerts</p>
                                        <p className="text-2xl font-bold text-on-dark">{filteredAlerts.length}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="card-on-dark rounded-xl shadow-md p-6">
                                <div className="flex items-center">
                                    <div className="w-12 h-12 bg-red-900 rounded-lg flex items-center justify-center mr-4">
                                        <i data-lucide="alert-circle" className="w-6 h-6 text-red-400"></i>
                                    </div>
                                    <div>
                                        <p className="text-secondary-on-dark">Critical</p>
                                        <p className="text-2xl font-bold text-on-dark">{criticalAlerts.length}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="card-on-dark rounded-xl shadow-md p-6">
                                <div className="flex items-center">
                                    <div className="w-12 h-12 bg-yellow-900 rounded-lg flex items-center justify-center mr-4">
                                        <i data-lucide="alert-triangle" className="w-6 h-6 text-yellow-400"></i>
                                    </div>
                                    <div>
                                        <p className="text-secondary-on-dark">Warning</p>
                                        <p className="text-2xl font-bold text-on-dark">{warningAlerts.length}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="card-on-dark rounded-xl shadow-md p-6">
                                <div className="flex items-center">
                                    <div className="w-12 h-12 bg-slate-800 rounded-lg flex items-center justify-center mr-4">
                                        <i data-lucide="check-circle" className="w-6 h-6 text-slate-400"></i>
                                    </div>
                                    <div>
                                        <p className="text-secondary-on-dark">Unresolved</p>
                                        <p className="text-2xl font-bold text-on-dark">
                                            {filteredAlerts.filter(a => !a.resolved).length}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Active Alerts */}
                        {(filters.status === 'active' || filters.status === 'all') && (
                            <div className="mb-8">
                                <h2 className="text-xl font-semibold text-secondary-on-dark mb-4">
                                    Active Alerts
                                    <span className="text-sm text-slate-400 ml-2">
                                        ({criticalAlerts.length + warningAlerts.length + infoAlerts.length} items)
                                    </span>
                                </h2>
                                <div className="card-on-dark rounded-xl shadow-md overflow-hidden">
                                    {[...criticalAlerts, ...warningAlerts, ...infoAlerts].map(alert => (
                                        <div key={alert.id} className={`border-l-4 ${getAlertBorderClass(alert.type)} p-4 ${alert.id !== [...criticalAlerts, ...warningAlerts, ...infoAlerts][[...criticalAlerts, ...warningAlerts, ...infoAlerts].length - 1]?.id ? 'border-b border-slate-800' : ''}`}>
                                            <div className="flex justify-between">
                                                <div className="flex items-start">
                                                    <i data-lucide={getAlertIcon(alert.type)} className={`w-5 h-5 mr-3 mt-0.5 ${getAlertIconColor(alert.type)}`}></i>
                                                    <div>
                                                        <h3 className="font-medium text-on-dark">{alert.machineName}</h3>
                                                        <p className="text-secondary-on-dark">{alert.message}</p>
                                                        {alert.details && alert.details.length > 1 && (
                                                            <ul className="mt-2 list-disc pl-5 text-sm text-slate-300 space-y-1">
                                                                {alert.details.slice(1).map((detail, index) => <li key={index}>{detail}</li>)}
                                                            </ul>
                                                        )}
                                                        <p className="text-sm text-slate-400 mt-1">{alert.timestamp}</p>
                                                    </div>
                                                </div>
                                                <div className="flex space-x-2">
                                                    <button className="text-blue-400 hover:text-blue-300">
                                                        <i data-lucide="external-link" className="w-5 h-5"></i>
                                                    </button>
                                                    <button className="text-slate-400 hover:text-slate-300">
                                                        <i data-lucide="check" className="w-5 h-5"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}

                                    {[...criticalAlerts, ...warningAlerts, ...infoAlerts].length === 0 && (
                                        <div className="p-8 text-center text-slate-400">
                                            <i data-lucide="check-circle" className="w-12 h-12 mx-auto mb-3 text-green-500"></i>
                                            <p>No active alerts match your filters</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Resolved Alerts */}
                        {(filters.status === 'resolved' || filters.status === 'all') && (
                            <div>
                                <h2 className="text-xl font-semibold text-secondary-on-dark mb-4">
                                    Resolved Alerts
                                    <span className="text-sm text-slate-400 ml-2">
                                        ({resolvedAlerts.length} items)
                                    </span>
                                </h2>
                                <div className="card-on-dark rounded-xl shadow-md overflow-hidden">
                                    {resolvedAlerts.map(alert => (
                                        <div key={alert.id} className={`border-l-4 ${getAlertBorderClass(alert.type)} p-4 ${alert.id !== resolvedAlerts[resolvedAlerts.length - 1]?.id ? 'border-b border-slate-800' : ''} opacity-70`}>
                                            <div className="flex justify-between">
                                                <div className="flex items-start">
                                                    <i data-lucide={getAlertIcon(alert.type)} className={`w-5 h-5 mr-3 mt-0.5 ${getAlertIconColor(alert.type)}`}></i>
                                                    <div>
                                                        <h3 className="font-medium text-on-dark">{alert.machineName}</h3>
                                                        <p className="text-secondary-on-dark">{alert.message}</p>
                                                        <p className="text-sm text-slate-400 mt-1">{alert.timestamp}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center text-green-500">
                                                    <i data-lucide="check-circle" className="w-5 h-5 mr-1"></i>
                                                    <span className="text-sm">Resolved</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}

                                    {resolvedAlerts.length === 0 && (
                                        <div className="p-8 text-center text-slate-400">
                                            <i data-lucide="check-circle" className="w-12 h-12 mx-auto mb-3 text-green-500"></i>
                                            <p>No resolved alerts match your filters</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            return (
                <div>
                    <Alerts />
                </div>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
