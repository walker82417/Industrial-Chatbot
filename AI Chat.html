<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Industrial Monitoring Web App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth-guard.js"></script>

    <!-- Custom Styles -->
    <style>
        /* Chat messages */
        .chat-message {
            animation: fadeInSlideUp 0.3s ease-out;
        }

        @keyframes fadeInSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Dark theme styles - Full Dark Version */
        .brand-dark {
            background-color: #020617;
            background-image:
                radial-gradient(at 20% 80%, #0f172a 0px, transparent 50%),
                radial-gradient(at 80% 20%, #0f172a 0px, transparent 50%),
                radial-gradient(at 40% 40%, #1e3a8a 0px, transparent 50%);
        }

        .text-on-dark {
            color: #f1f5f9;
        }

        .text-secondary-on-dark {
            color: #cbd5e1;
        }

        .card-on-dark {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            backdrop-filter: blur(10px);
        }

        .nav-link-dark {
            color: #cbd5e1;
            transition: color 0.3s ease;
        }

        .nav-link-dark:hover {
            color: #f1f5f9;
        }

        .nav-link-dark.active {
            color: #3b82f6;
        }

        /* Typing indicator */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: #3b82f6;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }


        .bot-avatar-thinking {
            position: relative;
            animation: botPulse 1.8s ease-in-out infinite;
        }

        .bot-avatar-thinking::after {
            content: '';
            position: absolute;
            inset: -6px;
            border: 1px solid rgba(59, 130, 246, 0.55);
            border-radius: 9999px;
            animation: botRing 1.8s ease-out infinite;
        }

        .response-card-thinking {
            overflow: hidden;
            position: relative;
        }

        .response-card-thinking::before {
            content: '';
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #60a5fa, transparent);
            animation: thinkingSweep 1.6s ease-in-out infinite;
        }

        .thinking-copy {
            animation: softBlink 1.8s ease-in-out infinite;
        }

        @keyframes botPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.25); transform: scale(1); }
            50% { box-shadow: 0 0 24px 2px rgba(59, 130, 246, 0.35); transform: scale(1.04); }
        }

        @keyframes botRing {
            0% { opacity: 0.9; transform: scale(0.88); }
            100% { opacity: 0; transform: scale(1.35); }
        }

        @keyframes thinkingSweep {
            0% { left: -40%; }
            100% { left: 110%; }
        }

        @keyframes softBlink {
            0%, 100% { opacity: 0.65; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="brand-dark min-h-screen">
    <div id="root">
        <div class="min-h-screen flex items-center justify-center p-6 text-center">
            <div class="card-on-dark rounded-2xl p-8 max-w-md shadow-2xl">
                <div class="w-14 h-14 bg-blue-900 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-300 text-2xl">AI</div>
                <h1 class="text-2xl font-bold text-on-dark mb-2">Loading Industrial AI Assistant</h1>
                <p class="text-secondary-on-dark">If this stays on screen, refresh the page or check that the browser can load the required scripts.</p>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        // Initial Chat Data
        const mockChatMessages = [
            {
                id: 1,
                sender: "ai",
                text: "Hi! I’m your Industrial AI Assistant. Ask a question or tap a quick prompt to check motor health, find faults, understand warning reasons, or decide the next maintenance action.",
                timestamp: "Ready now"
            }
        ];
        const expertTopics = [
            "Machine Diagnostics",
            "Maintenance Scheduling",
            "Performance Optimization",
            "Energy Consumption",
            "Predictive Analysis",
            "Fault Detection"
        ];
        const quickPrompts = [
            { label: "Status", message: "Check current machine status", action: "status" },
            { label: "Fault", message: "Is there any fault right now?", action: "fault" },
            { label: "Reason", message: "Why is the warning happening?", action: "reason" },
            { label: "Action", message: "What maintenance action should I take?", action: "maintenance" }
        ];
        const CHAT_HISTORY_KEY = "industrialAiChatHistory";
        const CHAT_CONTEXT_KEY = "industrialAiChatContext";
        const MAX_CHAT_HISTORY = 40;
    </script>
    <script type="text/babel">
        // Navigation Bar Component
        const NavBar = () => {
            const navLinks = [
                { name: "Home", path: "index.html" },
                { name: "Dashboard", path: "dashboard.html" },
                { name: "Analytics", path: "Analytics.html" },
                { name: "Alerts", path: "Alerts.html" },
                { name: "AI Chat", path: "AI Chat.html" },
                { name: "Settings", path: "Settings.html" }
            ];
            const [authUser, setAuthUser] = React.useState(null);
            const [authReady, setAuthReady] = React.useState(false);

            React.useEffect(() => {
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                const storedEmail = localStorage.getItem('userEmail');
                const fallbackUser = storedEmail
                    ? { displayName: localStorage.getItem('profileName') || storedEmail.split('@')[0], email: storedEmail }
                    : null;

                if (!auth) {
                    setAuthUser(fallbackUser);
                    setAuthReady(true);
                    return;
                }

                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setAuthUser(user || fallbackUser);
                    setAuthReady(true);
                });

                return () => unsubscribe();
            }, []);

            const handleSignOut = async () => {
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                if (auth) {
                    try {
                        await auth.signOut();
                    } catch (error) {
                        console.error('Sign out failed:', error);
                    }
                }
                localStorage.removeItem('token');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userId');
                localStorage.removeItem('profileName');
                window.location.href = 'login.html';
            };

            // Get current page to highlight active link
            const getCurrentPage = () => {
                const path = window.location.pathname;
                const filename = path.substring(path.lastIndexOf('/') + 1);
                return filename === '' ? 'index.html' : filename;
            };

            const currentPage = getCurrentPage();

            return (
                <nav className="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md shadow-lg">
                    <div className="container mx-auto px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center space-x-10">
                            <div className="flex items-center">
                                <i data-lucide="activity" className="w-8 h-8 text-blue-500 mr-2"></i>
                                <span className="text-xl font-bold text-on-dark">Industrial Chatbot</span>
                            </div>

                            <div className="hidden md:flex space-x-8 relative">
                                {navLinks.map((link) => (
                                    <a
                                        key={link.name}
                                        href={link.path}
                                        className={`nav-link nav-link-dark px-1 py-2 ${currentPage === link.path ? 'active' : ''}`}
                                    >
                                        {link.name}
                                    </a>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center space-x-4">
                            {!authReady ? (
                                <div className="w-24 h-9 rounded-lg bg-slate-700/70 animate-pulse"></div>
                            ) : authUser ? (
                                <>
                                    <button
                                        onClick={() => window.location.href = "Settings.html?tab=profile"}
                                        className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-100 px-3 py-2 rounded-lg transition-colors border border-slate-600"
                                    >
                                        <span className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-semibold">
                                            {(authUser.displayName || authUser.email || "U").charAt(0).toUpperCase()}
                                        </span>
                                        <span className="hidden md:inline">{authUser.displayName || "Profile"}</span>
                                    </button>
                                    <button
                                        onClick={handleSignOut}
                                        className="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg transition-colors"
                                    >
                                        Sign Out
                                    </button>
                                </>
                            ) : null}
                        </div>
                    </div>
                </nav>
            );
        };

        // Subscription Check Component
        const SubscriptionCheck = ({ children }) => {
            const [hasSubscription, setHasSubscription] = React.useState(false);
            const [isLoading, setIsLoading] = React.useState(true);

            React.useEffect(() => {
                const isSubscriptionActive = (subscription) => {
                    if (!subscription) return false;
                    const activeUserId = localStorage.getItem('userId');
                    const activeEmail = localStorage.getItem('userEmail');
                    const belongsToCurrentUser = (!subscription.userId || subscription.userId === activeUserId)
                        && (!subscription.userEmail || subscription.userEmail === activeEmail);
                    const startDate = new Date(subscription.startDate || subscription.timestamp);
                    const expiryDate = subscription.expiresAt
                        ? new Date(subscription.expiresAt)
                        : new Date(startDate.getTime() + (30 * 24 * 60 * 60 * 1000));
                    return belongsToCurrentUser && Number.isFinite(startDate.getTime()) && new Date() <= expiryDate;
                };

                const loadSubscriptionStatus = async () => {
                    const auth = window.industrialFirebase && window.industrialFirebase.auth;
                    const database = window.industrialFirebase && window.industrialFirebase.database;
                    const localSubscription = localStorage.getItem('subscription');

                    if (localSubscription) {
                        try {
                            const parsedSubscription = JSON.parse(localSubscription);
                            if (isSubscriptionActive(parsedSubscription)) {
                                setHasSubscription(true);
                                setIsLoading(false);
                                return;
                            }
                        } catch (e) {
                            console.error('Error parsing subscription data:', e);
                        }
                    }

                    if (!auth || !database) {
                        setHasSubscription(false);
                        setIsLoading(false);
                        return;
                    }

                    const unsubscribe = auth.onAuthStateChanged(async (user) => {
                        if (!user) {
                            setHasSubscription(false);
                            setIsLoading(false);
                            return;
                        }

                        try {
                            const snapshot = await database.ref(`users/${user.uid}/subscription`).once('value');
                            const remoteSubscription = snapshot.val();
                            const active = isSubscriptionActive(remoteSubscription);
                            if (active) {
                                localStorage.setItem('subscription', JSON.stringify(remoteSubscription));
                            }
                            setHasSubscription(active);
                        } catch (error) {
                            console.error('Failed to load saved subscription:', error);
                            setHasSubscription(false);
                        } finally {
                            setIsLoading(false);
                        }
                    });

                    return () => unsubscribe();
                };

                let cleanup;
                loadSubscriptionStatus().then((unsubscribe) => {
                    cleanup = unsubscribe;
                });

                return () => {
                    if (cleanup) cleanup();
                };
            }, []);

            if (isLoading) {
                return (
                    <div className="flex items-center justify-center h-screen">
                        <div className="text-center">
                            <div className="w-16 h-16 border-t-4 border-blue-500 border-solid rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="text-secondary-on-dark">Loading...</p>
                        </div>
                    </div>
                );
            }

            if (!hasSubscription) {
                return (
                    <div className="flex flex-col items-center justify-center h-screen p-8">
                        <div className="max-w-md w-full card-on-dark rounded-xl shadow-md p-8 text-center">
                            <div className="w-16 h-16 bg-blue-900 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i data-lucide="lock" className="w-8 h-8 text-blue-400"></i>
                            </div>
                            <h2 className="text-2xl font-bold text-on-dark mb-4">Subscription Required</h2>
                            <p className="text-secondary-on-dark mb-6">
                                You need an active subscription to access the AI Chat feature. Please subscribe to one of our plans to unlock this feature.
                            </p>
                            <div className="space-y-4">
                                <button
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition-colors"
                                    onClick={() => window.location.href = "subscription.html"}
                                >
                                    View Subscription Plans
                                </button>
                                <button
                                    className="w-full bg-slate-800 hover:bg-slate-700 text-on-dark px-6 py-3 rounded-lg transition-colors"
                                    onClick={() => window.location.href = "dashboard.html"}
                                >
                                    Back to Dashboard
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return children;
        };

        // AI Chat Component
        const AIChat = () => {
            const loadSavedMessages = () => {
                try {
                    const savedMessages = JSON.parse(localStorage.getItem(CHAT_HISTORY_KEY) || '[]');
                    return Array.isArray(savedMessages) && savedMessages.length ? savedMessages : mockChatMessages;
                } catch (error) {
                    console.error('Could not load chat history:', error);
                    return mockChatMessages;
                }
            };

            const loadSavedContext = () => {
                try {
                    return JSON.parse(localStorage.getItem(CHAT_CONTEXT_KEY) || 'null');
                } catch (error) {
                    console.error('Could not load chat context:', error);
                    return null;
                }
            };

            const [message, setMessage] = React.useState('');
            const [messages, setMessages] = React.useState(loadSavedMessages);
            const [conversationContext, setConversationContext] = React.useState(loadSavedContext);
            const [isTyping, setIsTyping] = React.useState(false);
            const chatContainerRef = React.useRef(null);

            const normalizeQuestion = (question) => String(question || '')
                .toLowerCase()
                .replace(/\b(maintainance|maintenence|maintenancee|maintanance|metannce|metanance|mntenance|maintaince|servicng|servicing)\b/g, 'maintenance')
                .replace(/\b(requird|requred|reqired|reqd|requre|requiered)\b/g, 'required')
                .replace(/\b(nxt|nexxt)\b/g, 'next')
                .replace(/\b(shedule|schedul|sedule)\b/g, 'schedule')
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            const hasAny = (text, signals) => signals.some((signal) => text.includes(signal));

            const getMetricFocus = (text) => {
                if (hasAny(text, ['temperature', 'heat', 'hot', 'cooling'])) return 'temperature';
                if (hasAny(text, ['vibration', 'shake', 'shaking', 'noise', 'bearing'])) return 'vibration';
                if (hasAny(text, ['voltage', 'volt', 'supply'])) return 'voltage';
                if (hasAny(text, ['current', 'amp', 'load'])) return 'current';
                if (hasAny(text, ['power', 'watt', 'energy'])) return 'power';
                return null;
            };

            const detectQueryProfile = (question, requestedAction = null, previousContext = null) => {
                const q = normalizeQuestion(question);
                const previousIntent = previousContext && previousContext.intent;
                const metricFocus = getMetricFocus(q) || (previousContext && previousContext.metricFocus) || null;
                const followUpSignals = ['why', 'reason', 'explain', 'details', 'more', 'then', 'next', 'now what', 'what about', 'and', 'ok', 'okay', 'yes', 'safe'];
                const isShortFollowUp = q.split(' ').length <= 4 && followUpSignals.some((signal) => q.includes(signal));
                const intentSignals = {
                    greeting: ['hi', 'hello', 'hey', 'good morning', 'good evening', 'namaste', 'start', 'help'],
                    health_status: [
                        'healthy', 'health', 'safe', 'status', 'condition', 'normal', 'okay', 'ok',
                        'fine', 'running', 'doing', 'state', 'working', 'stable', 'good', 'bad',
                        'load', 'loading', 'loaded', 'performance', 'how is machine', 'how is motor'
                    ],
                    fault_detection: [
                        'fault', 'faulty', 'problem', 'issue', 'failure', 'fail', 'abnormal', 'defect',
                        'damage', 'detected', 'bearing', 'vibration', 'overheat', 'alarm', 'danger',
                        'wrong', 'noise', 'shake', 'shaking', 'heat', 'hot'
                    ],
                    reason_analysis: [
                        'why', 'reason', 'cause', 'because', 'explain', 'increasing', 'increase',
                        'rising', 'high', 'hot', 'heating', 'changed', 'fluctuate', 'unstable',
                        'what happened', 'how come', 'due to'
                    ],
                    recommendation: [
                        'should', 'recommend', 'suggest', 'action', 'do', 'stop', 'continue', 'run',
                        'shutdown', 'maintenance', 'repair', 'inspect', 'prevent', 'next', 'now',
                        'schedule', 'service', 'fix', 'plan', 'when', 'required', 'due', 'deadline'
                    ],
                    report: ['report', 'summary', 'full detail', 'details', 'generate', 'print', 'record']
                };

                const scores = Object.entries(intentSignals).reduce((acc, [intent, words]) => {
                    acc[intent] = words.reduce((score, word) => score + (q.includes(word) ? 1 : 0), 0);
                    return acc;
                }, {});

                if (/can i|do i need|is it okay|is it safe|what to do|what should i do/.test(q)) scores.recommendation += 3;
                if (/what happened|what is happening|what is wrong|why/.test(q)) scores.reason_analysis += 3;
                if (/any fault|fault found|fault detected|is there fault|problem/.test(q)) scores.fault_detection += 3;
                if (/how is|machine condition|motor condition|machine status|motor status|check status|current status/.test(q)) scores.health_status += 3;
                if (/generate report|make report|show report|health report/.test(q)) scores.report += 4;
                if (/schedule maintenance|maintenance schedule|service plan/.test(q)) scores.recommendation += 4;
                const needsMaintenanceTiming = /(when|next|due|required|schedule|time).*(maintenance|service|repair)|maintenance.*(when|next|due|required|schedule|time)/.test(q);
                if (needsMaintenanceTiming) scores.recommendation += 6;
                if (metricFocus && hasAny(q, ['why', 'reason', 'high', 'low', 'normal', 'safe'])) scores.reason_analysis += 2;

                const actionIntentMap = {
                    status: 'health_status',
                    fault: 'fault_detection',
                    reason: 'reason_analysis',
                    maintenance: 'recommendation',
                    report: 'report'
                };

                let intent = requestedAction && actionIntentMap[requestedAction]
                    ? actionIntentMap[requestedAction]
                    : Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];

                if (!requestedAction && previousIntent && isShortFollowUp) {
                    if (hasAny(q, ['why', 'reason', 'explain'])) intent = 'reason_analysis';
                    else if (hasAny(q, ['next', 'now what', 'what to do', 'safe', 'ok', 'okay', 'yes'])) intent = 'recommendation';
                    else if (hasAny(q, ['fault', 'problem'])) intent = 'fault_detection';
                    else if (hasAny(q, ['report', 'details', 'more'])) intent = 'report';
                    else intent = previousIntent;
                }

                const finalIntent = intent === 'greeting' ? 'health_status' : intent;

                return {
                    raw: question,
                    normalized: q,
                    intent: finalIntent,
                    action: requestedAction || (finalIntent === 'report' ? 'report' : null),
                    isGreeting: scores.greeting > 0 && q.split(' ').length <= 4,
                    isFollowUp: Boolean(previousIntent && isShortFollowUp && !requestedAction),
                    referencedIntent: previousIntent || null,
                    needsMaintenanceTiming,
                    metricFocus
                };
            };

            const AI_MODEL_ENDPOINT_KEY = 'industrialAiModelEndpoint';

            const predictionLabels = ['Normal', 'Warning', 'Failure'];
            const faultLabels = ['Healthy', 'Bearing Fault'];

            const fallbackPrediction = (data) => {
                const rules = [
                    data.temperature >= 80 ? 2 : data.temperature >= 70 ? 1 : 0,
                    data.vibration >= 5 ? 2 : data.vibration >= 3 ? 1 : 0,
                    data.current >= 25 || data.power >= 3500 ? 1 : 0,
                    data.voltage <= 180 || data.voltage >= 260 ? 1 : 0
                ];
                const score = rules.reduce((sum, value) => sum + value, 0);
                const prediction = score >= 4 ? 2 : score >= 2 ? 1 : 0;
                const fault = data.vibration >= 4 || data.temperature >= 78 ? 1 : 0;
                return {
                    prediction,
                    fault,
                    predictionText: predictionLabels[prediction],
                    faultText: faultLabels[fault],
                    confidence: prediction === 0 ? 0.82 : 0.74,
                    source: 'Local safety fallback'
                };
            };

            const normalizeModelResult = (result, data) => {
                const fallback = fallbackPrediction(data);
                const rawPrediction = result.prediction ?? result.prediction_class ?? result.status_code ?? result.status;
                const rawFault = result.fault_class ?? result.fault ?? result.fault_code;
                const prediction = Number.isFinite(Number(rawPrediction))
                    ? Number(rawPrediction)
                    : predictionLabels.findIndex((label) => label.toLowerCase() === String(rawPrediction || '').toLowerCase());
                const fault = Number.isFinite(Number(rawFault))
                    ? Number(rawFault)
                    : faultLabels.findIndex((label) => label.toLowerCase() === String(rawFault || '').toLowerCase());

                return {
                    prediction: prediction >= 0 ? prediction : fallback.prediction,
                    fault: fault >= 0 ? fault : fallback.fault,
                    predictionText: result.label || result.prediction_label || predictionLabels[prediction] || fallback.predictionText,
                    faultText: result.fault_label || faultLabels[fault] || fallback.faultText,
                    confidence: Number(result.confidence ?? result.probability ?? fallback.confidence),
                    source: 'External fault model'
                };
            };

            const runFaultModel = async (data) => {
                const endpoint = localStorage.getItem(AI_MODEL_ENDPOINT_KEY);
                if (!endpoint) return fallbackPrediction(data);

                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (!response.ok) throw new Error('External fault model is not reachable');
                    return normalizeModelResult(await response.json(), data);
                } catch (error) {
                    console.error('External fault model failed, using local fallback:', error);
                    return { ...fallbackPrediction(data), source: 'Local safety fallback (external model unavailable)' };
                }
            };

            const getLoadStatus = (data) => {
                if (data.current >= 25 || data.power >= 3500) return 'High load';
                if (data.current >= 18 || data.power >= 2500) return 'Moderate load';
                return 'Normal load';
            };

            const getStatusText = (prediction) => {
                if (prediction === 2) return 'Critical';
                if (prediction === 1) return 'Warning';
                return 'Healthy';
            };

            const getMainReasons = (data, modelResult) => {
                const reasons = [];
                if (data.temperature >= 80) reasons.push(`temperature is critical at ${data.temperature} °F`);
                else if (data.temperature >= 70) reasons.push(`temperature is warm at ${data.temperature} °F`);

                if (data.vibration >= 5) reasons.push(`vibration is high at ${data.vibration}`);
                else if (data.vibration >= 3) reasons.push(`vibration is elevated at ${data.vibration}`);

                if (data.current >= 25) reasons.push(`current draw is high at ${data.current} A`);
                if (data.power >= 3500) reasons.push(`power usage is high at ${data.power} W`);
                if (data.voltage && (data.voltage <= 180 || data.voltage >= 260)) reasons.push(`voltage is outside the expected range at ${data.voltage} V`);
                if (modelResult.fault === 1 && !reasons.some((reason) => reason.includes('vibration') || reason.includes('temperature'))) {
                    reasons.push('the model sees a bearing-fault pattern');
                }

                return reasons.length ? reasons : ['all main readings are within the normal range'];
            };

            const getMaintenancePlan = (prediction, fault, data) => {
                if (prediction === 2) {
                    return 'Stop the motor safely, inspect bearing/alignment/lubrication, and restart only after maintenance clearance.';
                }
                if (prediction === 1 || fault === 1 || data.temperature >= 70 || data.vibration >= 3) {
                    return 'Schedule preventive maintenance soon; check bearing condition, lubrication, mounting bolts, cooling, and load balance.';
                }
                return 'No urgent maintenance is needed. Keep normal monitoring and do the next routine service as planned.';
            };

            const getMaintenanceSchedule = (prediction, fault, data) => {
                if (prediction === 2) return 'Required immediately — stop safely and inspect before the next restart.';
                if (fault === 1 || data.temperature >= 78 || data.vibration >= 4) return 'Required within 24 hours because the readings show fault risk.';
                if (prediction === 1 || data.temperature >= 70 || data.vibration >= 3) return 'Required within 48 hours to prevent the warning from becoming a failure.';
                if (data.current >= 18 || data.power >= 2500) return 'Plan it within the next 7 days because the motor is under moderate load.';
                return 'No urgent service is required; keep the next routine maintenance window, about 30 days or your normal plant schedule.';
            };

            const buildDataLine = (data, generatedAt, confidenceText, source) => (
                `Data: ${data.voltage} V, ${data.current} A, ${data.power} W, vibration ${data.vibration}, temperature ${data.temperature} °F. Updated: ${generatedAt}. Confidence: ${confidenceText}. Source: ${source}.`
            );

            const getMetricInsight = (metricFocus, data) => {
                if (metricFocus === 'temperature') {
                    if (data.temperature >= 78) return `Temperature answer: ${data.temperature} °F is high, usually caused by load, cooling, lubrication, or bearing friction.`;
                    return `Temperature answer: ${data.temperature} °F is acceptable right now.`;
                }
                if (metricFocus === 'vibration') {
                    if (data.vibration >= 4) return `Vibration answer: ${data.vibration} is high, so check bearing wear, imbalance, mounting, or misalignment.`;
                    return `Vibration answer: ${data.vibration} is not showing a major vibration issue right now.`;
                }
                if (metricFocus === 'voltage') {
                    if (data.voltage <= 180 || data.voltage >= 260) return `Voltage answer: ${data.voltage} V is outside the expected band, so check supply quality and connections.`;
                    return `Voltage answer: ${data.voltage} V looks acceptable for this live sample.`;
                }
                if (metricFocus === 'current') {
                    if (data.current >= 25) return `Current/load answer: ${data.current} A is high, usually due to overload, friction, or mechanical resistance.`;
                    return `Current/load answer: ${data.current} A is not showing heavy electrical load right now.`;
                }
                if (metricFocus === 'power') {
                    if (data.power >= 3500) return `Power answer: ${data.power} W is high, so verify load demand and mechanical drag.`;
                    return `Power answer: ${data.power} W is within the expected live range.`;
                }
                return '';
            };

            const generateResponse = ({ profile, modelResult, data, generatedAt }) => {
                const { prediction, fault, predictionText, faultText, confidence, source } = modelResult;
                const confidenceText = Number.isFinite(confidence) ? `${Math.round(confidence * 100)}%` : 'N/A';
                const statusText = getStatusText(prediction);
                const loadText = getLoadStatus(data);
                const reasons = getMainReasons(data, modelResult);
                const reasonText = reasons.join('; ');
                const maintenancePlan = getMaintenancePlan(prediction, fault, data);
                const maintenanceSchedule = getMaintenanceSchedule(prediction, fault, data);
                const dataLine = buildDataLine(data, generatedAt, confidenceText, source);
                const greeting = profile.isGreeting ? 'Hi! ' : '';
                const followUpLine = profile.isFollowUp ? 'Following up on your last question: ' : '';
                const metricLine = getMetricInsight(profile.metricFocus, data);
                const metricPrefix = metricLine ? `${metricLine}\n` : '';

                if (profile.action === 'report' || profile.intent === 'report') {
                    return `${greeting}${followUpLine}Motor Health Report
Status: ${statusText}
Load: ${loadText}
Fault: ${fault === 1 ? faultText : 'No major fault'}
Next maintenance: ${maintenanceSchedule}
Reason: ${reasonText}.
${metricPrefix}Action: ${maintenancePlan}
${dataLine}`;
                }

                if (profile.intent === 'fault_detection') {
                    if (fault === 1 || prediction > 0) {
                        return `${greeting}${followUpLine}Fault check: ${fault === 1 ? faultText : predictionText} risk is present.
Reason: ${reasonText}.
${metricPrefix}Action: ${maintenancePlan}
${dataLine}`;
                    }

                    return `${greeting}${followUpLine}Fault check: no major fault detected right now.
Reason: ${reasonText}.
${metricPrefix}Action: continue normal monitoring.
${dataLine}`;
                }

                if (profile.intent === 'reason_analysis') {
                    return `${greeting}${followUpLine}Reason: ${reasonText}.
Status: ${statusText}. Load: ${loadText}. Fault: ${fault === 1 ? faultText : 'No major fault'}.
${metricPrefix}Action: ${maintenancePlan}
${dataLine}`;
                }
                if (profile.intent === 'recommendation') {
                    if (profile.needsMaintenanceTiming) {
                        return `${greeting}${followUpLine}Next maintenance: ${maintenanceSchedule}
Why: ${reasonText}.
${metricPrefix}Current status: ${statusText}; ${loadText}; fault result is ${fault === 1 ? faultText : 'clear'}.
What to do: ${maintenancePlan}
${dataLine}`;
                    }

                    return `${greeting}${followUpLine}Maintenance action: ${maintenancePlan}
Next maintenance: ${maintenanceSchedule}
Why: ${reasonText}.
${metricPrefix}Current status: ${statusText}; ${loadText}; fault result is ${fault === 1 ? faultText : 'clear'}.
${dataLine}`;
                }

                return `${greeting}${followUpLine}Motor status: ${statusText}.
Load: ${loadText}. Fault: ${fault === 1 ? faultText : 'No major fault'}.
Reason: ${reasonText}.
${metricPrefix}Action: ${maintenancePlan}
${dataLine}`;
            };

            const runRealtimeAnalysis = async (question, requestedAction = null, previousContext = null) => {
                const response = await fetch('https://api.thingspeak.com/channels/3340934/feeds/last.json?api_key=582TFZMMRBY94Z5S');
                if (!response.ok) throw new Error('Unable to fetch live motor data');
                const feed = await response.json();

                const data = {
                    voltage: Number(feed.field1) || 0,
                    current: Number(feed.field2) || 0,
                    power: Number(feed.field3) || 0,
                    vibration: Number(feed.field4) || 0,
                    temperature: Number(feed.field5) || 0
                };

                const profile = detectQueryProfile(question, requestedAction, previousContext);
                const modelResult = await runFaultModel(data);
                const generatedAt = feed.created_at ? new Date(feed.created_at).toLocaleString() : new Date().toLocaleString();
                return {
                    text: generateResponse({ profile, modelResult, data, generatedAt }),
                    context: {
                        intent: profile.intent,
                        action: profile.action,
                        status: getStatusText(modelResult.prediction),
                        load: getLoadStatus(data),
                        fault: modelResult.faultText,
                        faultDetected: modelResult.fault === 1,
                        reasons: getMainReasons(data, modelResult),
                        maintenancePlan: getMaintenancePlan(modelResult.prediction, modelResult.fault, data),
                        maintenanceSchedule: getMaintenanceSchedule(modelResult.prediction, modelResult.fault, data),
                        metricFocus: profile.metricFocus,
                        data,
                        generatedAt
                    }
                };
            };

            React.useEffect(() => {
                // Initialize Lucide icons
                lucide.createIcons();

                // Scroll to bottom of chat
                if (chatContainerRef.current) {
                    chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
                }
            }, [messages]);

            React.useEffect(() => {
                try {
                    localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(messages.slice(-MAX_CHAT_HISTORY)));
                } catch (error) {
                    console.error('Could not save chat history:', error);
                }
            }, [messages]);

            React.useEffect(() => {
                try {
                    if (conversationContext) {
                        localStorage.setItem(CHAT_CONTEXT_KEY, JSON.stringify(conversationContext));
                    }
                } catch (error) {
                    console.error('Could not save chat context:', error);
                }
            }, [conversationContext]);

            const handleSendMessage = (presetMessage = message, requestedAction = null) => {
                if (isTyping) return;
                const outgoingText = String(presetMessage || '').trim();
                if (outgoingText === '') return;

                const newMessage = {
                    id: `${Date.now()}-user`,
                    sender: 'user',
                    text: outgoingText,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                setMessages(prev => [...prev, newMessage]);
                setMessage('');
                setIsTyping(true);

                (async () => {
                    try {
                        const analysis = await runRealtimeAnalysis(newMessage.text, requestedAction, conversationContext);
                        const aiResponse = {
                            id: `${Date.now()}-ai`,
                            sender: 'ai',
                            text: analysis.text,
                            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                        };
                        setConversationContext(analysis.context);
                        setMessages(prev => [...prev, aiResponse]);
                    } catch (error) {
                        const aiResponse = {
                            id: `${Date.now()}-error`,
                            sender: 'ai',
                            text: `I couldn't reach the live motor feed right now, but the chat is working. Please check your internet connection and try again. Error: ${error.message}`,
                            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                        };
                        setMessages(prev => [...prev, aiResponse]);
                    } finally {
                        setIsTyping(false);
                    }
                })();
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            };

            const handleTopicClick = (topic) => {
                const topicActions = {
                    "Maintenance Scheduling": "maintenance",
                    "Predictive Analysis": "report",
                    "Fault Detection": "fault"
                };
                handleSendMessage(`Give me ${topic.toLowerCase()} insight for current motor data`, topicActions[topic] || "status");
            };

            const sendPrompt = (prompt, action = null) => {
                handleSendMessage(prompt, action);
            };

            const clearChatHistory = () => {
                localStorage.removeItem(CHAT_HISTORY_KEY);
                localStorage.removeItem(CHAT_CONTEXT_KEY);
                setMessages(mockChatMessages);
                setConversationContext(null);
            };

            React.useEffect(() => {
                const urlPrompt = new URLSearchParams(window.location.search).get('prompt');
                const savedPrompt = localStorage.getItem('industrialAiSuggestedPrompt');
                const promptToUse = urlPrompt || savedPrompt;
                if (!promptToUse) return;
                localStorage.removeItem('industrialAiSuggestedPrompt');
                setMessage(promptToUse);
            }, []);

            return (
                <div className="flex flex-col h-screen">
                    <NavBar />

                    <div className="flex flex-1 overflow-hidden">
                        {/* Main Chat Area */}
                        <div className="flex-1 flex flex-col">
                            {/* Chat Header */}
                            <div className="card-on-dark border-b border-slate-800 p-4">
                                <div className="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                                    <div className="flex items-center">
                                        <div className={`w-10 h-10 bg-blue-900 rounded-full flex items-center justify-center mr-3 ${isTyping ? 'bot-avatar-thinking' : ''}`}>
                                            <i data-lucide="bot" className="w-5 h-5 text-blue-400"></i>
                                        </div>
                                        <div>
                                            <h2 className="font-semibold text-on-dark">Industrial AI Assistant</h2>
                                            <p className={`text-sm text-secondary-on-dark ${isTyping ? 'thinking-copy' : ''}`}>
                                                {isTyping ? 'Understanding your question and checking live motor data...' : 'Ready to analyze live ThingSpeak motor data'}
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {quickPrompts.map((prompt) => (
                                            <button
                                                key={prompt.label}
                                                onClick={() => sendPrompt(prompt.message, prompt.action)}
                                                disabled={isTyping}
                                                className="rounded-full border border-blue-500/40 bg-blue-950/70 px-3 py-1 text-xs text-blue-200 hover:bg-blue-900 disabled:opacity-50"
                                            >
                                                {prompt.label}
                                            </button>
                                        ))}
                                        <button
                                            onClick={clearChatHistory}
                                            disabled={isTyping}
                                            className="rounded-full border border-slate-600 px-3 py-1 text-xs text-slate-300 hover:bg-slate-800 disabled:opacity-50"
                                        >
                                            Clear history
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Chat Messages */}
                            <div ref={chatContainerRef} className="flex-1 overflow-y-auto p-4 bg-slate-950">
                                <div className="max-w-3xl mx-auto min-h-full">
                                    {messages.map(msg => (
                                        <div
                                            key={msg.id}
                                            className={`mb-4 chat-message ${msg.sender === 'user' ? 'text-right' : ''}`}
                                        >
                                            <div className={`inline-block max-w-xs md:max-w-2xl px-4 py-3 rounded-lg shadow-lg ${msg.sender === 'user' ? 'bg-blue-600 text-white' : 'card-on-dark border border-slate-700 text-on-dark'}`}>
                                                <p className="whitespace-pre-line leading-relaxed">{msg.text}</p>
                                                <p className={`text-xs mt-1 ${msg.sender === 'user' ? 'text-blue-200' : 'text-slate-400'}`}>{msg.timestamp}</p>
                                            </div>
                                        </div>
                                    ))}

                                    {isTyping && (
                                        <div className="mb-4 chat-message">
                                            <div className="inline-block card-on-dark response-card-thinking border border-blue-800/70 px-4 py-3 rounded-lg shadow-lg">
                                                <div className="flex items-center gap-3">
                                                    <div className="typing-indicator">
                                                        <span></span>
                                                        <span></span>
                                                        <span></span>
                                                    </div>
                                                    <div>
                                                        <p className="text-sm text-on-dark thinking-copy">AI is understanding your question...</p>
                                                        <p className="text-xs text-slate-400">Checking live data, reason, and maintenance timing.</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Chat Input */}
                            <div className="card-on-dark border-t border-slate-800 p-4">
                                <div className="max-w-3xl mx-auto flex">
                                    <textarea
                                        value={message}
                                        onChange={(e) => setMessage(e.target.value)}
                                        onKeyDown={handleKeyPress}
                                        className="flex-1 border border-slate-700 rounded-l-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none bg-slate-900 text-on-dark"
                                        placeholder="Ask about machine status, faults, warning reasons, or next action..."
                                        rows={1}
                                    />
                                    <button
                                        onClick={() => handleSendMessage()}
                                        disabled={message.trim() === '' || isTyping}
                                        className="bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-r-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        <i data-lucide="send" className="w-5 h-5"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Expert Topics Sidebar */}
                        <div className="hidden lg:flex w-72 card-on-dark border-l border-slate-800 p-4 flex-col">
                            <h3 className="font-semibold text-on-dark mb-4">Expert Topics</h3>
                            <div className="space-y-2 mb-8">
                                {expertTopics.map((topic, index) => (
                                    <button
                                        key={index}
                                        className="w-full text-left bg-slate-800 hover:bg-slate-700 rounded-lg px-4 py-2 transition-colors text-secondary-on-dark"
                                        onClick={() => handleTopicClick(topic)}
                                    >
                                        {topic}
                                    </button>
                                ))}
                            </div>

                            <h3 className="font-semibold text-on-dark mb-4">Quick Actions</h3>
                            <div className="space-y-2">
                                <button onClick={() => sendPrompt('Check current machine status', 'status')} className="w-full text-left bg-blue-900 hover:bg-blue-800 rounded-lg px-4 py-2 transition-colors text-blue-300">
                                    Check Machine Status
                                </button>
                                <button onClick={() => sendPrompt('What maintenance action should I take?', 'maintenance')} className="w-full text-left bg-blue-900 hover:bg-blue-800 rounded-lg px-4 py-2 transition-colors text-blue-300">
                                    Schedule Maintenance
                                </button>
                                <button onClick={() => sendPrompt('Generate a short live motor health report', 'report')} className="w-full text-left bg-blue-900 hover:bg-blue-800 rounded-lg px-4 py-2 transition-colors text-blue-300">
                                    Generate Report
                                </button>
                            </div>

                            <div className="mt-auto pt-6">
                                <div className="bg-slate-800 rounded-lg p-4">
                                    <h4 className="font-medium text-on-dark mb-2">Need Help?</h4>
                                    <p className="text-sm text-secondary-on-dark mb-3">Contact our support team for assistance.</p>
                                    <button
                                        className="w-full bg-slate-700 hover:bg-slate-600 text-white rounded-lg px-4 py-2 transition-colors"
                                        onClick={() => window.location.href = "about.html"}
                                    >
                                        Contact Support
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            return (
                <SubscriptionCheck>
                    <AIChat />
                </SubscriptionCheck>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
