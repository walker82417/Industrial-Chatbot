<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Industrial Monitoring Web App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth-service.js"></script>

    <!-- Vercel Web Analytics -->
    <script src="js/analytics.js"></script>

    <!-- Custom Styles -->
    <style>
        /* Dark theme styles - Full Dark Version */
        .brand-dark {
            background-color: #020617;
            background-image:
                radial-gradient(at 20% 80%, #0f172a 0px, transparent 50%),
                radial-gradient(at 80% 20%, #0f172a 0px, transparent 50%),
                radial-gradient(at 40% 40%, #1e3a8a 0px, transparent 50%);
        }

        .text-on-dark {
            color: #f1f5f9;
        }

        .text-secondary-on-dark {
            color: #cbd5e1;
        }

        .card-on-dark {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            backdrop-filter: blur(10px);
        }

        .input-on-dark {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            color: #f8fafc;
        }

        .input-on-dark::placeholder {
            color: #94a3b8;
        }
    </style>
</head>
<body class="brand-dark min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const AuthPage = () => {
            const [formData, setFormData] = React.useState({
                fullName: '',
                companyName: '',
                phoneNumber: '',
                jobTitle: '',
                email: '',
                password: ''
            });

        React.useEffect(() => {
            lucide.createIcons();
        }, []);

        const handleInputChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
        };

        const [isSubmitting, setIsSubmitting] = React.useState(false);
        const [message, setMessage] = React.useState('');
        const [messageType, setMessageType] = React.useState('info');

        const handleSubmit = async (e) => {
            e.preventDefault();
            setMessage('');

            if (!window.industrialAuthService || !window.industrialAuthService.isConfigured()) {
                setMessageType('error');
                setMessage('Firebase is not connected yet. Open the Firebase Setup page first.');
                return;
            }

            setIsSubmitting(true);

            try {
                await window.industrialAuthService.signUp(formData);
                setMessageType('success');
                setMessage('Account created successfully. Redirecting to dashboard...');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } catch (err) {
                console.error(err);
                setMessageType('error');
                setMessage(err.message || 'Something went wrong during sign up.');
            } finally {
                setIsSubmitting(false);
            }
        };

        return (
            <div className="min-h-screen bg-gradient-to-br from-slate-950 to-slate-900 flex items-center justify-center p-4">
                <div className="card-on-dark rounded-xl shadow-2xl w-full max-w-md p-8">
                    <div className="text-center mb-8">
                        <h1 className="text-3xl font-bold text-on-dark">Create your account</h1>
                        <p className="text-secondary-on-dark mt-2">
                            Configure Firebase once, then this page is ready for online sign up on Vercel.
                        </p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-4">
                        <input
                            type="text"
                            name="fullName"
                            value={formData.fullName}
                            onChange={handleInputChange}
                            placeholder="Full name"
                            className="input-on-dark w-full rounded-lg px-4 py-3"
                            required
                        />
                        <input
                            type="text"
                            name="companyName"
                            value={formData.companyName}
                            onChange={handleInputChange}
                            placeholder="Company name"
                            className="input-on-dark w-full rounded-lg px-4 py-3"
                            required
                        />
                        <input
                            type="tel"
                            name="phoneNumber"
                            value={formData.phoneNumber}
                            onChange={handleInputChange}
                            placeholder="Phone number"
                            className="input-on-dark w-full rounded-lg px-4 py-3"
                            required
                        />
                        <input
                            type="text"
                            name="jobTitle"
                            value={formData.jobTitle}
                            onChange={handleInputChange}
                            placeholder="Job title"
                            className="input-on-dark w-full rounded-lg px-4 py-3"
                            required
                        />
                        <input
                            type="email"
                            name="email"
                            value={formData.email}
                            onChange={handleInputChange}
                            placeholder="Email address"
                            className="input-on-dark w-full rounded-lg px-4 py-3"
                            required
                        />
                        <input
                            type="password"
                            name="password"
                            value={formData.password}
                            onChange={handleInputChange}
                            placeholder="Password"
                            className="input-on-dark w-full rounded-lg px-4 py-3"
                            minLength="6"
                            required
                        />

                        {message && (
                            <div className={`rounded-lg px-4 py-3 text-sm ${
                                messageType === 'error'
                                    ? 'bg-red-500/10 text-red-300 border border-red-500/30'
                                    : 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/30'
                            }`}>
                                {message}
                            </div>
                        )}

                        <button
                            type="submit"
                            disabled={isSubmitting}
                            className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-600 text-white font-medium py-3 rounded-lg transition-colors"
                        >
                            {isSubmitting ? 'Creating account...' : 'Sign Up'}
                        </button>
                    </form>

                    <p className="text-secondary-on-dark text-sm mt-6 text-center">
                        Already have an account? <a href="login.html" className="text-blue-400 hover:text-blue-300">Sign in</a>
                    </p>
                    <p className="text-secondary-on-dark text-sm mt-3 text-center">
                        Forgot your password? <a href="login.html" className="text-blue-400 hover:text-blue-300">Go to Login</a> and use the reset email option.
                    </p>
                    <p className="text-secondary-on-dark text-sm mt-3 text-center">
                        Need to connect Firebase? <a href="firebase-setup.html" className="text-blue-400 hover:text-blue-300">Open setup page</a>
                    </p>
                </div>
            </div>
        );
    };

    const App = () => <AuthPage />;
    const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
</script>

</body>

</html>
