<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription - Industrial Monitoring Web App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>

    <!-- Vercel Speed Insights -->
    <script type="module" src="js/speed-insights.js"></script>

    <!-- Custom Styles -->
    <style>
        /* Dark theme styles - Full Dark Version */
        .brand-dark {
            background-color: #020617;
            background-image:
                radial-gradient(at 20% 80%, #0f172a 0px, transparent 50%),
                radial-gradient(at 80% 20%, #0f172a 0px, transparent 50%),
                radial-gradient(at 40% 40%, #1e3a8a 0px, transparent 50%);
        }

        .text-on-dark {
            color: #f1f5f9;
        }

        .text-secondary-on-dark {
            color: #cbd5e1;
        }

        .card-on-dark {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            backdrop-filter: blur(10px);
        }

        .nav-link-dark {
            color: #cbd5e1;
            transition: color 0.3s ease;
        }

        .nav-link-dark:hover {
            color: #f1f5f9;
        }

        .nav-link-dark.active {
            color: #3b82f6;
        }

        /* Pricing card styles */
        .pricing-card {
            transition: all 0.3s ease;
        }

        .pricing-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px -10px rgba(59, 130, 246, 0.5);
        }

        .pricing-card.featured {
            border: 2px solid #3b82f6;
            transform: scale(1.05);
        }

        .pricing-card.featured:hover {
            transform: scale(1.05) translateY(-10px);
        }

        @keyframes successPulse {
            0% { transform: scale(0.85); opacity: 0.6; }
            60% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-pulse {
            animation: successPulse 0.7s ease-out forwards;
        }
    </style>
</head>
<body class="brand-dark min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        // Navigation Bar Component
        const NavBar = () => {
            const navLinks = [
                { name: "Home", path: "index.html" },
                { name: "Dashboard", path: "dashboard.html" },
                { name: "Analytics", path: "Analytics.html" },
                { name: "Alerts", path: "Alerts.html" },
                { name: "AI Chat", path: "AI Chat.html" },
                { name: "Settings", path: "Settings.html" }
            ];
            const [authUser, setAuthUser] = React.useState(null);
            const [authReady, setAuthReady] = React.useState(false);

            React.useEffect(() => {
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                const storedEmail = localStorage.getItem('userEmail');
                const fallbackUser = storedEmail
                    ? { displayName: localStorage.getItem('profileName') || storedEmail.split('@')[0], email: storedEmail }
                    : null;

                if (!auth) {
                    setAuthUser(fallbackUser);
                    setAuthReady(true);
                    return;
                }

                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setAuthUser(user || fallbackUser);
                    setAuthReady(true);
                });

                return () => unsubscribe();
            }, []);

            const handleSignOut = async () => {
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                if (auth) {
                    try {
                        await auth.signOut();
                    } catch (error) {
                        console.error('Sign out failed:', error);
                    }
                }
                localStorage.removeItem('token');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userId');
                localStorage.removeItem('profileName');
                window.location.href = 'login.html';
            };

            // Get current page to highlight active link
            const getCurrentPage = () => {
                const path = window.location.pathname;
                const filename = path.substring(path.lastIndexOf('/') + 1);
                return filename === '' ? 'index.html' : filename;
            };

            const currentPage = getCurrentPage();

            return (
                <nav className="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md shadow-lg">
                    <div className="container mx-auto px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center space-x-10">
                            <div className="flex items-center">
                                <i data-lucide="activity" className="w-8 h-8 text-blue-500 mr-2"></i>
                                <span className="text-xl font-bold text-on-dark">Industrial Chatbot</span>
                            </div>

                            <div className="hidden md:flex space-x-8 relative">
                                {navLinks.map((link) => (
                                    <a
                                        key={link.name}
                                        href={link.path}
                                        className={`nav-link nav-link-dark px-1 py-2 ${currentPage === link.path ? 'active' : ''}`}
                                    >
                                        {link.name}
                                    </a>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center space-x-4">
                            {!authReady ? (
                                <div className="w-24 h-9 rounded-lg bg-slate-700/70 animate-pulse"></div>
                            ) : authUser ? (
                                <>
                                    <button
                                        onClick={() => window.location.href = "Settings.html?tab=profile"}
                                        className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-100 px-3 py-2 rounded-lg transition-colors border border-slate-600"
                                    >
                                        <span className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-semibold">
                                            {(authUser.displayName || authUser.email || "U").charAt(0).toUpperCase()}
                                        </span>
                                        <span className="hidden md:inline">{authUser.displayName || "Profile"}</span>
                                    </button>
                                    <button
                                        onClick={handleSignOut}
                                        className="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg transition-colors"
                                    >
                                        Sign Out
                                    </button>
                                </>
                            ) : (
                                <>
                                    <a href="login.html" className="text-secondary-on-dark hover:text-on-dark transition-colors">Sign In</a>
                                    <a href="signup.html" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors">Sign Up</a>
                                </>
                            )}
                        </div>
                    </div>
                </nav>
            );
        };

        // Subscription Component
        const Subscription = () => {
            const [selectedPlan, setSelectedPlan] = React.useState('premium');
            const [isProcessing, setIsProcessing] = React.useState(false);
            const [successPlan, setSuccessPlan] = React.useState('');

            React.useEffect(() => {
                // Initialize Lucide icons
                lucide.createIcons();
            }, [successPlan]);

            const plans = [
                {
                    id: 'basic',
                    name: 'Basic',
                    price: '$29',
                    period: 'per month',
                    features: [
                        'Real-time monitoring for up to 5 machines',
                        'Basic alerts and notifications',
                        'Standard analytics',
                        'Email support'
                    ],
                    cta: 'Get Started',
                    featured: false
                },
                {
                    id: 'premium',
                    name: 'Premium',
                    price: '$79',
                    period: 'per month',
                    features: [
                        'Real-time monitoring for up to 20 machines',
                        'Advanced alerts and notifications',
                        'Advanced analytics with AI insights',
                        'Priority email and chat support',
                        'AI Chat access',
                        'Predictive maintenance schedules'
                    ],
                    cta: 'Most Popular',
                    featured: true
                },
                {
                    id: 'enterprise',
                    name: 'Enterprise',
                    price: '$199',
                    period: 'per month',
                    features: [
                        'Unlimited machine monitoring',
                        'Custom alerts and notifications',
                        'Advanced analytics with AI insights',
                        '24/7 dedicated support',
                        'AI Chat access',
                        'Predictive maintenance schedules',
                        'Custom integrations',
                        'Dedicated account manager'
                    ],
                    cta: 'Contact Sales',
                    featured: false
                }
            ];

            const handleSubscribe = async (planId) => {
                setIsProcessing(true);
                setSuccessPlan('');

                const now = new Date();
                const expiresAt = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000));
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                const database = window.industrialFirebase && window.industrialFirebase.database;
                const currentUser = auth && auth.currentUser;
                const subscription = {
                    plan: planId,
                    timestamp: now.toISOString(),
                    startDate: now.toISOString(),
                    expiresAt: expiresAt.toISOString(),
                    status: 'active',
                    userId: currentUser ? currentUser.uid : localStorage.getItem('userId'),
                    userEmail: currentUser ? currentUser.email : localStorage.getItem('userEmail')
                };

                try {
                    localStorage.setItem('subscription', JSON.stringify(subscription));
                    if (database && subscription.userId) {
                        await database.ref(`users/${subscription.userId}/subscription`).set(subscription);
                    }
                    setSuccessPlan(planId);
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1800);
                } catch (error) {
                    console.error('Failed to save subscription:', error);
                    setIsProcessing(false);
                    alert('Subscription saved locally, but cloud sync failed. Please try again if it does not appear after login.');
                }
            };

            return (
                <div>
                    <NavBar />
                    {(isProcessing || successPlan) && (
                        <div className="fixed inset-0 z-[100] bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-6">
                            <div className="card-on-dark rounded-2xl p-8 max-w-md w-full text-center border border-blue-500/60 shadow-2xl shadow-blue-900/40">
                                {!successPlan ? (
                                    <>
                                        <div className="w-16 h-16 border-t-4 border-blue-500 border-solid rounded-full animate-spin mx-auto mb-5"></div>
                                        <h2 className="text-2xl font-bold text-on-dark mb-2">Activating subscription...</h2>
                                        <p className="text-secondary-on-dark">Securing your 30-day access and syncing it to your account.</p>
                                    </>
                                ) : (
                                    <>
                                        <div className="w-20 h-20 bg-green-900 rounded-full flex items-center justify-center mx-auto mb-5 success-pulse">
                                            <i data-lucide="check" className="w-10 h-10 text-green-300"></i>
                                        </div>
                                        <h2 className="text-2xl font-bold text-on-dark mb-2">Subscription Activated!</h2>
                                        <p className="text-secondary-on-dark">Your {successPlan} plan is valid for 30 days. Redirecting to dashboard...</p>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                    <div className="p-8">
                        <div className="max-w-6xl mx-auto">
                            <div className="text-center mb-12">
                                <h1 className="text-4xl font-bold text-on-dark mb-4">Choose Your Plan</h1>
                                <p className="text-xl text-secondary-on-dark max-w-2xl mx-auto">
                                    Select the perfect plan for your industrial monitoring needs. Upgrade or downgrade at any time.
                                </p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {plans.map((plan) => (
                                    <div
                                        key={plan.id}
                                        className={`card-on-dark rounded-xl shadow-md overflow-hidden pricing-card ${plan.featured ? 'featured' : ''}`}
                                    onClick={() => setSelectedPlan(plan.id)}
                                    >
                                        {plan.featured && (
                                            <div className="bg-blue-600 text-white text-center py-2 text-sm font-semibold">
                                                MOST POPULAR
                                            </div>
                                        )}
                                        <div className="p-6">
                                            <h3 className="text-2xl font-bold text-on-dark mb-2">{plan.name}</h3>
                                            <div className="mb-6">
                                                <span className="text-4xl font-bold text-on-dark">{plan.price}</span>
                                                <span className="text-secondary-on-dark">/{plan.period}</span>
                                            </div>
                                            <ul className="mb-8 space-y-3">
                                                {plan.features.map((feature, index) => (
                                                    <li key={index} className="flex items-start">
                                                        <i data-lucide="check" className="w-5 h-5 text-green-500 mr-2 mt-0.5 flex-shrink-0"></i>
                                                        <span className="text-secondary-on-dark">{feature}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                            <button
                                                className={`w-full py-3 rounded-lg font-medium transition-colors ${
                                                    plan.featured
                                                        ? 'bg-blue-600 hover:bg-blue-700 text-white'
                                                        : 'bg-slate-800 hover:bg-slate-700 text-on-dark'
                                                }`}
                                                onClick={() => handleSubscribe(plan.id)}
                                                disabled={isProcessing}
                                            >
                                                {isProcessing && selectedPlan === plan.id ? 'Processing...' : plan.cta}
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="mt-12 text-center">
                                <h3 className="text-xl font-semibold text-on-dark mb-4">Need a Custom Solution?</h3>
                                <p className="text-secondary-on-dark mb-6 max-w-2xl mx-auto">
                                    Contact our sales team to create a custom plan tailored to your specific industrial monitoring requirements.
                                </p>
                                <button className="bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-lg transition-colors">
                                    Contact Sales
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            return <Subscription />;
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
