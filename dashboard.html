<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Industrial Monitoring Web App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom Styles -->
    <style>
        /* Custom animations */
        @keyframes fadeInSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-slide-up {
            animation: fadeInSlideUp 0.6s ease-out forwards;
        }

        /* Hover effects for cards */
        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }

        /* Dark theme styles - Full Dark Version */
        .brand-dark {
            background-color: #020617;
            background-image:
                radial-gradient(at 20% 80%, #0f172a 0px, transparent 50%),
                radial-gradient(at 80% 20%, #0f172a 0px, transparent 50%),
                radial-gradient(at 40% 40%, #1e3a8a 0px, transparent 50%);
        }

        .text-on-dark {
            color: #f1f5f9;
        }

        .text-secondary-on-dark {
            color: #cbd5e1;
        }

        .card-on-dark {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            backdrop-filter: blur(10px);
        }

        .nav-link-dark {
            color: #cbd5e1;
            transition: color 0.3s ease;
        }

        .nav-link-dark:hover {
            color: #f1f5f9;
        }

        .nav-link-dark.active {
            color: #3b82f6;
        }
    </style>
</head>
<body class="brand-dark min-h-screen">
    <div id="root"></div>
    <script type="text/javascript">
        // Mock Data
        const mockMachines = [
            {
                id: 1,
                name: "Induction Motor",
                status: "warning",
                location: "Factory Floor 1",
                lastMaintenance: "NA",
                type: "motor",
                image: "https://imgs.search.brave.com/L1ida3rt4P22VzR2yBDBI77xk8z7ny03QG4GnRty4fE/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly90My5m/dGNkbi5uZXQvanBn/LzA5LzIxLzE5LzQ2/LzM2MF9GXzkyMTE5/NDYzNV84YTRBSDBW/dUlGRndmZU5RWTlp/RzJySW9wZlZHNmVz/Ui5qcGc"
            },
            {
                id: 2,
                name: "Gear Hobbing Machine",
                status: "normal",
                location: "Factory Floor 1",
                lastMaintenance: "NA",
                type: "gear",
                image: "https://imgs.search.brave.com/My55eOXatDIHhz49Hy3Q7o78rMCklVz7v4ShIBNCC5A/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbWcu/eW91dHViZS5jb20v/dmkvbllzbFZrM1No/bzgvaHFkZWZhdWx0/LmpwZw"
            }
        ];
    </script>
    <script type="text/babel">
        // Navigation Bar Component
        const NavBar = () => {
            const navLinks = [
                { name: "Home", path: "index.html" },
                { name: "Dashboard", path: "dashboard.html" },
                { name: "Analytics", path: "Analytics.html" },
                { name: "Alerts", path: "Alerts.html" },
                { name: "AI Chat", path: "AI Chat.html" },
                { name: "Settings", path: "Settings.html" }
            ];
            const [authUser, setAuthUser] = React.useState(null);
            const [authReady, setAuthReady] = React.useState(false);

            React.useEffect(() => {
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                const storedEmail = localStorage.getItem('userEmail');
                const fallbackUser = storedEmail
                    ? { displayName: localStorage.getItem('profileName') || storedEmail.split('@')[0], email: storedEmail }
                    : null;

                if (!auth) {
                    setAuthUser(fallbackUser);
                    setAuthReady(true);
                    return;
                }

                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setAuthUser(user || fallbackUser);
                    setAuthReady(true);
                });

                return () => unsubscribe();
            }, []);

            const handleSignOut = async () => {
                const auth = window.industrialFirebase && window.industrialFirebase.auth;
                if (auth) {
                    try {
                        await auth.signOut();
                    } catch (error) {
                        console.error('Sign out failed:', error);
                    }
                }
                localStorage.removeItem('token');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userId');
                localStorage.removeItem('profileName');
                window.location.href = 'login.html';
            };

            // Get current page to highlight active link
            const getCurrentPage = () => {
                const path = window.location.pathname;
                const filename = path.substring(path.lastIndexOf('/') + 1);
                return filename === '' ? 'index.html' : filename;
            };

            const currentPage = getCurrentPage();

            return (
                <nav className="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md shadow-lg">
                    <div className="container mx-auto px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center space-x-10">
                            <div className="flex items-center">
                                <i data-lucide="activity" className="w-8 h-8 text-blue-500 mr-2"></i>
                                <span className="text-xl font-bold text-on-dark">Industrial Chatbot</span>
                            </div>

                            <div className="hidden md:flex space-x-8 relative">
                                {navLinks.map((link) => (
                                    <a
                                        key={link.name}
                                        href={link.path}
                                        className={`nav-link nav-link-dark px-1 py-2 ${currentPage === link.path ? 'active' : ''}`}
                                    >
                                        {link.name}
                                    </a>
                                ))}
                            </div>
                        </div>

                        <div className="flex items-center space-x-4">
                            {!authReady ? (
                                <div className="w-24 h-9 rounded-lg bg-slate-700/70 animate-pulse"></div>
                            ) : authUser ? (
                                <>
                                    <button
                                        onClick={() => window.location.href = "Settings.html?tab=profile"}
                                        className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-100 px-3 py-2 rounded-lg transition-colors border border-slate-600"
                                    >
                                        <span className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-semibold">
                                            {(authUser.displayName || authUser.email || "U").charAt(0).toUpperCase()}
                                        </span>
                                        <span className="hidden md:inline">{authUser.displayName || "Profile"}</span>
                                    </button>
                                    <button
                                        onClick={handleSignOut}
                                        className="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg transition-colors"
                                    >
                                        Sign Out
                                    </button>
                                </>
                            ) : null}
                        </div>
                    </div>
                </nav>
            );
        };

        // Dashboard Component
        const Dashboard = () => {
            const [machines, setMachines] = React.useState(mockMachines);
            const [subscriptionInfo, setSubscriptionInfo] = React.useState(null);
            const [motorHistory, setMotorHistory] = React.useState([]);
            const [motorLiveError, setMotorLiveError] = React.useState('');
            const needsAttention = machines.filter(machine => machine.status !== 'normal');
            const otherMachines = machines.filter(machine => machine.status === 'normal');

            React.useEffect(() => {
                // Initialize Lucide icons
                lucide.createIcons();
                const storedSubscription = localStorage.getItem('subscription');
                if (storedSubscription) {
                    try {
                        setSubscriptionInfo(JSON.parse(storedSubscription));
                    } catch (error) {
                        console.error('Failed to parse subscription:', error);
                    }
                }

                const fetchMotorHistory = async () => {
                    try {
                        const response = await fetch('https://api.thingspeak.com/channels/3340934/feeds.json?api_key=582TFZMMRBY94Z5S&results=20');
                        if (!response.ok) throw new Error('Unable to fetch motor history');
                        const payload = await response.json();
                        const feeds = Array.isArray(payload.feeds) ? payload.feeds : [];
                        setMotorHistory(feeds);
                        setMotorLiveError('');
                    } catch (error) {
                        console.error(error);
                        setMotorLiveError('Unable to load induction motor graph data right now.');
                    }
                };

                fetchMotorHistory();
                const refreshInterval = setInterval(fetchMotorHistory, 15000);

                return () => clearInterval(refreshInterval);
            }, []);

            React.useEffect(() => {
                if (!motorHistory.length) return;
                const canvas = document.getElementById('inductionMotorChart');
                if (!canvas) return;

                const chart = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: motorHistory.map((feed) => new Date(feed.created_at).toLocaleTimeString()),
                        datasets: [
                            { label: 'Voltage', data: motorHistory.map((f) => Number(f.field1)), borderColor: '#22c55e', tension: 0.3 },
                            { label: 'Current', data: motorHistory.map((f) => Number(f.field2)), borderColor: '#3b82f6', tension: 0.3 },
                            { label: 'Power', data: motorHistory.map((f) => Number(f.field3)), borderColor: '#f59e0b', tension: 0.3 },
                            { label: 'Vibration', data: motorHistory.map((f) => Number(f.field4)), borderColor: '#ef4444', tension: 0.3 },
                            { label: 'Temperature', data: motorHistory.map((f) => Number(f.field5)), borderColor: '#a855f7', tension: 0.3 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#cbd5e1' } } },
                        scales: {
                            x: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148, 163, 184, 0.1)' } },
                            y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148, 163, 184, 0.1)' } }
                        }
                    }
                });

                return () => chart.destroy();
            }, [motorHistory]);

            const getPlanLimit = (plan) => {
                if (plan === 'basic') return 5;
                if (plan === 'premium') return 20;
                return Number.POSITIVE_INFINITY;
            };

            const getSubscriptionStatus = () => {
                if (!subscriptionInfo) return { text: 'No active subscription', expiresOn: '-', active: false, limit: 0 };

                const now = new Date();
                const start = new Date(subscriptionInfo.timestamp);
                const expiry = new Date(start.getTime() + (30 * 24 * 60 * 60 * 1000));
                const active = now <= expiry;
                return {
                    text: `${subscriptionInfo.plan?.toUpperCase() || 'UNKNOWN'} Plan`,
                    expiresOn: expiry.toLocaleDateString(),
                    active,
                    limit: getPlanLimit(subscriptionInfo.plan)
                };
            };

            const subscriptionStatus = getSubscriptionStatus();

            const handleAddMachine = () => {
                if (!subscriptionStatus.active) {
                    alert('Please activate a subscription plan before adding machines.');
                    window.location.href = 'subscription.html';
                    return;
                }

                if (machines.length >= subscriptionStatus.limit) {
                    alert(`Your ${subscriptionStatus.text} allows up to ${subscriptionStatus.limit} machines.`);
                    return;
                }

                const name = prompt('Enter machine name:');
                if (!name) return;
                const location = prompt('Enter machine location:', 'Factory Floor 1') || 'Factory Floor 1';
                const newMachine = {
                    id: Date.now(),
                    name,
                    status: 'normal',
                    location,
                    lastMaintenance: new Date().toLocaleDateString(),
                    type: 'custom',
                    image: 'https://images.unsplash.com/photo-1581092160607-ee22731a4b97?auto=format&fit=crop&w=1200&q=60'
                };
                setMachines(prev => [...prev, newMachine]);
            };

            const getStatusColor = (status) => {
                switch (status) {
                    case 'critical': return 'bg-red-500';
                    case 'warning': return 'bg-yellow-500';
                    default: return 'bg-green-500';
                }
            };

            const getStatusText = (status) => {
                switch (status) {
                    case 'critical': return 'Critical';
                    case 'warning': return 'Warning';
                    default: return 'Normal';
                }
            };

            return (
                <div>
                    <NavBar />
                    <div className="p-8">
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-2xl font-bold text-on-dark">Machine Status</h1>
                            <div className="flex gap-3">
                                <button
                                    className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center"
                                    onClick={handleAddMachine}
                                >
                                    <i data-lucide="plus" className="w-5 h-5 mr-2"></i>
                                    Add Machine
                                </button>
                                <button
                                    className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center"
                                    onClick={() => window.location.href = "maintenance.html"}
                                >
                                    <i data-lucide="calendar" className="w-5 h-5 mr-2"></i>
                                    Maintenance Schedules
                                </button>
                            </div>
                        </div>

                        <div className="card-on-dark rounded-xl p-4 mb-8 border border-slate-700">
                            <p className="text-on-dark font-medium">Subscription: {subscriptionStatus.text}</p>
                            <p className="text-secondary-on-dark text-sm">
                                Expiry Date: {subscriptionStatus.expiresOn} • Machine Limit: {Number.isFinite(subscriptionStatus.limit) ? subscriptionStatus.limit : 'Unlimited'}
                            </p>
                        </div>

                        <div className="card-on-dark rounded-xl p-6 mb-8 border border-slate-700">
                            <h2 className="text-xl font-semibold text-on-dark mb-4">Induction Motor Trend Graph</h2>
                            {motorLiveError ? (
                                <p className="text-red-400">{motorLiveError}</p>
                            ) : (
                                <div className="h-80">
                                    <canvas id="inductionMotorChart"></canvas>
                                </div>
                            )}
                        </div>

                        {/* Needs Attention Section */}
                        {needsAttention.length > 0 && (
                            <div className="mb-10">
                                <h2 className="text-xl font-semibold text-secondary-on-dark mb-4 flex items-center">
                                    <i data-lucide="alert-triangle" className="w-5 h-5 mr-2 text-yellow-500"></i>
                                    Needs Attention
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {needsAttention.map(machine => (
                                        <div
                                            key={machine.id}
                                            className="card-on-dark rounded-xl shadow-md overflow-hidden card-hover cursor-pointer"
                                            onClick={() => window.location.href = `machine-detail.html?id=${machine.id}`}
                                        >
                                            <div className="h-40 overflow-hidden">
                                                <img
                                                    src={machine.image}
                                                    alt={machine.name}
                                                    className="w-full h-full object-cover"
                                                />
                                            </div>
                                            <div className="p-4">
                                                <div className="flex justify-between items-start mb-2">
                                                    <h3 className="text-lg font-semibold text-on-dark">{machine.name}</h3>
                                                    <span className={`inline-block w-3 h-3 rounded-full ${getStatusColor(machine.status)}`}></span>
                                                </div>
                                                <p className="text-secondary-on-dark text-sm mb-2">{machine.location}</p>
                                                <div className="flex justify-between text-xs text-slate-400">
                                                    <span>Last Maintenance: {machine.lastMaintenance}</span>
                                                    <span className="font-medium text-yellow-600">{getStatusText(machine.status)}</span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Other Machines Section */}
                        <div>
                            <h2 className="text-xl font-semibold text-secondary-on-dark mb-4 flex items-center">
                                <i data-lucide="check-circle" className="w-5 h-5 mr-2 text-green-500"></i>
                                Other Machines
                            </h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {otherMachines.map(machine => (
                                    <div
                                        key={machine.id}
                                        className="card-on-dark rounded-xl shadow-md overflow-hidden card-hover cursor-pointer"
                                        onClick={() => window.location.href = `machine-detail.html?id=${machine.id}`}
                                    >
                                        <div className="h-40 overflow-hidden">
                                            <img
                                                src={machine.image}
                                                alt={machine.name}
                                                className="w-full h-full object-cover"
                                            />
                                        </div>
                                        <div className="p-4">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="text-lg font-semibold text-on-dark">{machine.name}</h3>
                                                <span className={`inline-block w-3 h-3 rounded-full ${getStatusColor(machine.status)}`}></span>
                                            </div>
                                            <p className="text-secondary-on-dark text-sm mb-2">{machine.location}</p>
                                            <div className="flex justify-between text-xs text-slate-400">
                                                <span>Last Maintenance: {machine.lastMaintenance}</span>
                                                <span className="font-medium text-green-600">{getStatusText(machine.status)}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            return <Dashboard />;
        };



        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
